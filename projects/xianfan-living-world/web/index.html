<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f8f4e9"><meta name="description" content="仙凡共生：一张连续米制地图的活世界实验"><title>仙凡共生 · 连续天下 v0.6</title><link rel="stylesheet" href="overworld.css"></head><body>
<div class="shell"><header class="status"><div class="status-line"><div class="identity"><div class="avatar">心</div><div><h1 id="name">心魇说</h1><p id="role">平民 · 凡人</p></div></div><div><button class="mini" id="save">保存</button><button class="mini" id="newWorld" title="创建新世界">新局</button></div></div><div class="stats"><div class="stat">气血<div class="track"><i id="hpBar"></i></div><strong id="hpTxt">100/100</strong></div><div class="stat stamina">精力<div class="track"><i id="staminaBar"></i></div><strong id="staminaTxt">100/100</strong></div><span id="population"></span></div></header>
<div class="world-row"><div><strong id="place">临安县 · 东市</strong> <span id="time">承平三年</span></div><span id="travelMode">步行</span><button class="mini" id="realmButton" hidden>御剑</button></div>
<main class="game-body"><div id="canvasFrame" class="canvas-frame"><canvas id="worldCanvas" role="img" aria-label="连续地图：拖动浏览、双指缩放，点击建筑或人物查看信息；点击后再决定前往"></canvas>
<div class="map-badge"><strong>山河同图 · 无缝缩放</strong><span id="mapScale">米/像素</span></div><div class="map-tools"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="locate" class="locate" aria-label="定位当前人物">◎我</button></div>
<div class="map-foot"><span>●头像为人物 · 进屋走正门 · 城墙不穿越</span><button id="stop" hidden>停止行走</button></div></div>
<section id="records" class="record-frame" hidden></section><section id="sheet" class="sheet" hidden></section></main>
<div class="info-row"><strong id="speed">未移动</strong><span id="position">坐标 0,0m</span><button id="fast">30倍</button><button id="advanceDay">过一天</button></div><nav class="controlbar"><button data-view="map" class="selected">天下地图</button><button data-view="people">故人</button><button data-view="ledger">治理</button><button data-view="history">纪事</button></nav>
<div class="indoor" id="indoor" hidden><header><strong id="indoorName">建筑</strong><button id="exitRoom">出门回地图</button></header><svg id="indoorMap" viewBox="0 0 500 650"></svg></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="overworld-ui.js"></script></body></html>
