plugins { id 'com.android.application' }
android {
  namespace 'com.xinyanshuo.xianfan'
  compileSdk 35
  defaultConfig {
    applicationId 'com.xinyanshuo.xianfan.county'
    minSdk 26
    targetSdk 35
    versionCode 46
    versionName '0.46.0'
  }
  sourceSets { main { assets.srcDirs = ['../../web'] } }
  signingConfigs {
    prototype {
      storeFile file('../demo-signing/xianfan-demo.jks')
      storePassword 'DEMO_ONLY_XIANFAN_2026'
      keyAlias 'xianfan-demo'
      keyPassword 'DEMO_ONLY_XIANFAN_2026'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      signingConfig signingConfigs.prototype
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
