plugins { id 'com.android.application' }
android {
    namespace 'com.xinyanshuo.zhiyin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xinyanshuo.zhiyin.companion'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    // CI lab signing is intentionally public/insecure; never use in a release build.
    signingConfigs {
        zhiyinLab {
            def signingPath = System.getenv("ZHIYIN_SIGNING_FILE")
            storeFile file(signingPath ?: "missing-local-lab-signer.p12")
            storePassword System.getenv("ZHIYIN_SIGNING_PASSWORD") ?: "PublicLabOnly2026"
            keyAlias "zhiyin-lab"
            keyPassword System.getenv("ZHIYIN_SIGNING_PASSWORD") ?: "PublicLabOnly2026"
            storeType "pkcs12"
        }
    }
    buildTypes {
        debug {
            def signingPath = System.getenv("ZHIYIN_SIGNING_FILE")
            if (signingPath != null && signingPath.trim().length() > 0) {
                signingConfig signingConfigs.zhiyinLab
            }
        }
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
