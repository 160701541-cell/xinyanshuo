*{box-sizing:border-box}body{margin:0;background:#101b21;color:#f2ead5;font-family:system-ui,sans-serif;overflow:hidden}#screen{position:fixed;inset:0;background:#121e22;touch-action:none;overflow:hidden}#world{position:absolute;width:1600px;height:1040px;transform-origin:0 0;background:linear-gradient(135deg,#597558 0%,#576c4a 35%,#7b7961 70%,#6d8559 100%);box-shadow:0 0 100px #060c0c inset}.floor{position:absolute;inset:0;opacity:.75;background-image:linear-gradient(30deg,transparent 46%,#a8aa8470 47%,#8e9270 48%,transparent 49%),linear-gradient(150deg,transparent 46%,#c6c4a070 47%,#b6ac8a 48%,transparent 49%);background-size:64px 40px}.lane{position:absolute;background:repeating-linear-gradient(90deg,#bab09b,#bab09b 33px,#897d69 34px,#c2b8a6 35px),repeating-linear-gradient(#fff0 0 25px,#4c443b55 26px 27px);border:5px solid #837c6e;box-shadow:0 9px 13px #0003;transform:skewY(-13deg)}.lane.major{left:0;top:658px;width:1600px;height:124px}.lane.minor{left:680px;top:70px;width:125px;height:860px;transform:skewX(-24deg)}.plot{position:absolute;border:3px solid #c4b89955;background:#b0b18a22;transform:skewY(-13deg);border-radius:12px}.house{position:absolute;border:1px solid #3e3122;border-radius:5px 5px 12px 12px;background:#ddc9a2;box-shadow:14px 20px 18px #132a1d83;cursor:pointer;transform:skewY(-9deg)}.house:before{content:"";position:absolute;left:-9%;top:-43%;width:118%;height:53%;background:repeating-linear-gradient(90deg,#4a5553 0 10px,#5e706b 11px 22px,#2b3a39 23px 25px);transform:skewX(12deg);clip-path:polygon(12% 0,91% 0,100% 100%,0 100%);box-shadow:0 8px 4px #0005}.house:after{content:"";position:absolute;left:41%;bottom:0;width:21%;height:57%;border:6px double #533e32;background:#594a39;box-shadow:0 0 0 4px #382f2955}.house span{position:absolute;bottom:7%;left:4%;color:#44301b;font-size:13px;font-weight:700}.house.big{background:#a37758;border:6px solid #4b3026}.house.big:before{background:repeating-linear-gradient(90deg,#283b3f 0 8px,#4a5658 9px 20px,#1b </style><div id="screen"><div id="world"><div class="floor"></div><div class="lane major"></div><div class="lane minor"></div><div class="plot" style="left:190px;top:145px;width:350px;height:310px"></div><div class="plot" style="left:900px;top:150px;width:350px;height:300px"></div><div class="house" data-title="西侧民居" data-desc="临街瓦房；预览场景占位几何体，等待独立透明PNG替换。" style="left:260px;top:260px;width:265px;height:177px" tabindex="0"><span>民居 · B004</span></div><div class="house big" data-title="镇中客栈" data-desc="开放世界客栈节点，计划接入房间、NPC和买卖交互。" style="left:930px;top:250px;width:290px;height:200px" tabindex="0"><span>客栈 · B010</span></div><div class="house" data-title="街边仓房" data-desc="粮袋、木箱和库存生产节点。" style="left:325px;top:835px;width:250px;height:135px" tabindex="0"><span>仓房 · B006</span></div><div class="house big" data-title="北侧宗门建筑" data-desc="暂用几何占位形体；宗门大殿原图尚未从聊天文件同步至仓库。" style="left:1020px;top:835px;width:280px;height:135px" tabindex="0"><span>宗门建筑 · B013</span></div><div class="lampglow" style="left:720px;top:475px"></div><div class="lampglow" style="left:940px;top:690px"></div><div id="sprites"></div></div><div id="shade"></div></div><div class="bar"><strong>苍岚 · HD2D村镇拼装测试</strong><span class="badge">场景原型 · 非APK · 候选素材</span><button id="toggle">🌙 夜景</button><button id="reset">⌖ 复位</button><a href="./" style="color:#9bdddc;text-decoration:none">返回官网</a></div><div id="detail"><h2 id="title">可交互场景预览</h2><p id="description">手指拖动画面移动，双指缩放；点建筑或道具查看实体。现有PNG来自仓库候选图集，未通过独立素材QA。</p></div><div id="touch"><button id="minus">−</button><button id="plus">+</button></div><script>
'use strict';const world=document.getElementById('world'),screen=document.getElementById('screen'),detail=document.getElementById('description'),title=document.getElementById('title'),sprites=document.getElementById('sprites');let zoom=Math.min(innerWidth/1450,innerHeight/950,1),panX=0,panY=0,night=false,dragging=false,lastX=0,lastY=0;function home(){zoom=Math.min(innerWidth/1450,innerHeight/950,1);panX=(innerWidth-1600*zoom)/2;panY=(innerHeight-1040*zoom)/2+35;refresh()}function refresh(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')'}home();document.getElementById('reset').onclick=home;document.getElementById('toggle').onclick=()=>{night=!night;document.body.classList.toggle('night',night);document.getElementById('toggle').textContent=night?'☀️ 白天':'🌙 夜景'};function setzoom(f){let z=Math.min(2,Math.max(.3,zoom*f)),cx=innerWidth/2,cy=innerHeight/2;panX=cx-(cx-panX)*z/zoom;panY=cy-(cy-panY)*z/zoom;zoom=z;refresh()}document.getElementById('plus').onclick=()=>setzoom(1.2);document.getElementById('minus').onclick=()=>setzoom(1/1.2);let touches=[];screen.addEventListener('pointerdown',e=>{screen.setPointerCapture(e.pointerId);touches.push({id:e.pointerId,x:e.clientX,y:e.clientY});lastX=e.clientX;lastY=e.clientY;dragging=true});screen.addEventListener('pointermove',e=>{let k=touches.findIndex(t=>t.id===e.pointerId);if(k<0)return;let old=touches[k];if(touches.length===1){panX+=e.clientX-old.x;panY+=e.clientY-old.y;refresh()}else if(touches.length===2){let other=touches[1-k],a=Math.hypot(old.x-other.x,old.y-other.y),b=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(a>20)setzoom(b/a)}touches[k]={id:e.pointerId,x:e.clientX,y:e.clientY}});function drop(e){touches=touches.filter(t=>t.id!==e.pointerId);dragging=false}screen.addEventListener('pointerup',drop);screen.addEventListener('pointercancel',drop);screen.addEventListener('wheel',e=>{e.preventDefault();setzoom(e.deltaY<0?1.1:.9)},{passive:false});window.addEventListener('resize',home);
function select(t,d){title.textContent=t;detail.textContent=d}world.querySelectorAll('.house').forEach(el=>{el.onclick=()=>select(el.dataset.title,el.dataset.desc);el.onkeydown=e=>{if(e.key==='Enter')el.click()}});
const atlas='./art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg';const props=[{name:'市集布棚',x:735,y:520,row:0,col:1,w:162,h:162},{name:'水井',x:210,y:475,row:1,col:0,w:167,h:167},{name:'村口灯笼',x:740,y:330,row:0,col:3,w:117,h:160},{name:'柴堆',x:1190,y:500,row:1,col:3,w:153,h:150},{name:'石磨',x:545,y:545,row:1,col:2,w:147,h:150},{name:'粮袋',x:190,y:790,row:4,col:3,w:160,h:160},{name:'药草',x:570,y:205,row:2,col:1,w:145,h:150},{name:'井边水缸',x:1020,y:525,row:1,col:1,w:145,h:160},{name:'木推车',x:1030,y:730,row:3,col:3,w:155,h:160},{name:'草垛',x:1400,y:700,row:2,col:0,w:130,h:152}];const image=new Image();image.onload=()=>{const cellW=image.naturalWidth/4,cellH=image.naturalHeight/5;for(const item of props){let c=document.createElement('canvas');c.width=item.w;c.height=item.h;let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,item.col*cellW+3,item.row*cellH+3,cellW-6,cellH-6,0,0,c.width,c.height);let pixels=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<pixels.data.length;i+=4){const m=Math.max(pixels.data[i],pixels.data[i+1],pixels.data[i+2]);pixels.data[i+3]=m<16?0:m<45?Math.round((m-16)/29*255):255}ctx.putImageData(pixels,0,0);let el=document.createElement('div');el.className='marker';el.style.left=item.x+'px';el.style.top=item.y+'px';el.setAttribute('role','button');el.tabIndex=0;let label=document.createElement('label');label.textContent=item.name;el.append(c,label);el.onclick=()=>select(item.name,'当前为历史图集抠图候选；这是可交互位置测试，非通过QA的独立高清图。');el.onkeydown=e=>{if(e.key==='Enter')el.click()};sprites.append(el)}};image.onerror=()=>select('素材加载失败','请检查官网同步和浏览器网络，当前网页未找到候选图集。');image.src=atlas;</script></html>
