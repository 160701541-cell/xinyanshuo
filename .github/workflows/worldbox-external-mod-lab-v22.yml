name: 'WorldBox External MOD Lab v0.22 - NOT Canglan game'
on:
  push:
    branches:
      - 'worldbox/external-mod-lab-v22-zh-localization'
    paths:
      - 'tools/worldbox-xianxia/**'
      - '.github/workflows/worldbox-external-mod-lab-v22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 'Source regression tests - NOT Android certification'
        run: |
          python -m compileall -q tools/worldbox-xianxia
          python -m unittest tools/worldbox-xianxia/test_v39_manifest_dex_gate.py -v
          python -m unittest discover -s tools/worldbox-xianxia -p 'test_v*.py' -v
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 'Compile observer syntax against non-shipping contract stubs'
        run: dotnet build tools/worldbox-xianxia/tests/WorldBoxObserver.SourceSyntax.csproj -c Release --verbosity quiet
      - name: 'Native WorldBox UI reflection scenario - mocks, NOT phone visual certification'
        run: dotnet run --project tools/worldbox-xianxia/tests/NativeUiScenarioV32.csproj -c Release
      - name: 'Execute Chinese entity names and mutually exclusive panels'
        run: dotnet run --project tools/worldbox-xianxia/tests/WorldNamingScenarioV30.csproj -c Release
      - name: 'Verify giant preset enters cached new-world choices without changing live world'
        run: dotnet run --project tools/worldbox-xianxia/tests/GiantChoiceScenarioV31.csproj -c Release
      - name: 'Execute original C# observer frame budget safety regression'
        run: dotnet run --project tools/worldbox-xianxia/tests/FrameGuardScenarioV12.csproj -c Release
      - name: 'Execute font-size and localized UI C# regression'
        run: dotnet run --project tools/worldbox-xianxia/tests/FontAccessibilityScenarioV13.csproj -c Release
      - name: 'Execute per-actor Qi, breakthrough and cooldown C# gameplay tests'
        run: dotnet run --project tools/worldbox-xianxia/tests/CultivationScenarioV18.csproj -c Release
      - name: 'Execute runtime Chinese translation and other-MOD display regression'
        run: dotnet run --project tools/worldbox-xianxia/tests/RuntimeChineseScenarioV22.csproj -c Release
      - name: 'Execute original locale key and NML Chinese registration C# behavior test'
        run: dotnet run --project tools/worldbox-xianxia/tests/NativeLocaleScenarioV23.csproj -c Release
      - name: 'Execute opt-in untranslated menu audit C# privacy and export scenario'
        run: dotnet run --project tools/worldbox-xianxia/tests/UntranslatedMenuScenarioV23.csproj -c Release
      - name: 'Execute real-world ZIP shape regression (no proprietary MOD binaries)'
        run: |
          mkdir -p /tmp/worldbox-v34-modformat-jvm
          javac -encoding UTF-8 -d /tmp/worldbox-v34-modformat-jvm \
            tools/worldbox-xianxia/private-apk-lab/ModFormatV34.java \
            tools/worldbox-xianxia/tests/ModFormatV34Test.java
          java -cp /tmp/worldbox-v34-modformat-jvm com.xinyanshuo.worldbox.lab13.ModFormatV34Test
      - name: 'Execute money, production, district and borders conservation tests'
        run: dotnet run --project tools/worldbox-xianxia/tests/EconomyScenarioV35.csproj -c Release
      - name: 'Verify exact 10000x10000 virtual world sparse chunks, edge persistence, checksum and LRU budget'
        run: dotnet run --project tools/worldbox-xianxia/stream-world-v41/WorldGridTestsV41.csproj -c Release
      - name: 'Execute 2048-square world-size preset and actual menu-list simulation'
        run: dotnet run --project tools/worldbox-xianxia/tests/MapPresetBridgeV32.Tests.csproj -c Release
      - name: 'WorldBox external MOD only: prevent main-game edits'
        run: python tools/worldbox-xianxia/scope_gate.py
      - name: 'Ensure only source code is published in third-party test folder'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths=subprocess.check_output(['git','ls-files','--','tools/worldbox-xianxia'],text=True).splitlines()
          forbidden={'.apk','.pck','.dll','.pdb','.rar','.7z','.aab'}
          wrong=[p for p in paths if Path(p).suffix.lower() in forbidden]
          assert not wrong,wrong
          print('PASS source-only: ',len(paths),'files')
          PY
  android-public-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 'Fetch official Android NML DLL and public reference assemblies (transient)'
        run: |
          set -euo pipefail
          mkdir -p /tmp/wb-android-public-sdk
          curl -fLsS --retry 2 --connect-timeout 20 -o /tmp/wb-android-public-sdk/NeoModLoader_mobile.dll https://github.com/WorldBoxOpenMods/AndroidModLoader/releases/download/latest/NeoModLoader_mobile.dll
          echo "9ed209cdc783ed26998d31e461d1bbd317c83aff7ed8eefe844ddb0878a19c6a  /tmp/wb-android-public-sdk/NeoModLoader_mobile.dll" | sha256sum --check --status
          for fn in UnityEngine.CoreModule.dll UnityEngine.IMGUIModule.dll UnityEngine.TextRenderingModule.dll Assembly-CSharp.dll Assembly-CSharp-firstpass.dll Il2CppInterop.Runtime.dll Il2Cppmscorlib.dll; do
            curl -fLsS --retry 2 --connect-timeout 20 -o "/tmp/wb-android-public-sdk/$fn" "https://raw.githubusercontent.com/WorldBoxOpenMods/AndroidModLoader/master/android-assembly-dependencies/$fn"
            test -s "/tmp/wb-android-public-sdk/$fn"
          done
      - name: 'Inspect public reference WorldBox map size API metadata without running game'
        run: |
          dotnet run --project tools/worldbox-xianxia/inspector/MapTypes.csproj -- /tmp/wb-android-public-sdk/Assembly-CSharp.dll | tee /tmp/WORLDBOX_PUBLIC_MAP_TYPES.json
      - name: 'Inspect public WorldBox and NML localization API metadata (not game runtime)'
        run: |
          dotnet run --project tools/worldbox-xianxia/inspector/LocaleTypes.csproj -- /tmp/wb-android-public-sdk/Assembly-CSharp.dll /tmp/wb-android-public-sdk/NeoModLoader_mobile.dll | tee /tmp/WORLDBOX_PUBLIC_LOCALE_TYPES.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/WORLDBOX_PUBLIC_LOCALE_TYPES.json'))
          entries={x['type']:x for x in data['items']}
          assert 'LocalizedTextManager' in entries, 'Android public reference missing native localization manager'
          assert 'NeoModLoader.General.LM' in entries, 'Android NML reference missing localization registry'
          ltm=entries['LocalizedTextManager']
          lm=entries['NeoModLoader.General.LM']
          print('Native manager fields:',ltm['fields'])
          print('NML locale methods:',lm['methods'])
          assert 'Add' in lm['methods'] and 'ApplyLocale' in lm['methods'], 'NML locale API contract changed'
          PY
      - name: 'Compile against ACTUAL public Android NML, Unity and WorldBox APIs; never use source stubs'
        run: |
          dotnet build tools/worldbox-xianxia/tests/WorldBoxObserver.AndroidSdk.csproj -c Release --verbosity quiet -p:AndroidSdkPath=/tmp/wb-android-public-sdk
          echo 'SDK API compile candidate only; not an APK or an installed/loaded Android MOD'
      - name: 'Build NMLMods-root precompiled MOD candidate (correct COMPILED_NEOMOD folder)'
        run: |
          set -euo pipefail
          python tools/worldbox-xianxia/package_android_compiled_mod.py \
            --dll tools/worldbox-xianxia/tests/bin/Release/net8.0/XianxiaObserverMobileSDKProbe.dll \
            --manifest tools/worldbox-xianxia/nml-observer-v07/mod.json \
            --out /tmp/worldbox_v22_android_nml_mod_DEVICE_PENDING.zip \
            --locales tools/worldbox-xianxia/localization/nml-locales
      - name: 'Package legacy Mono source variant according to actual user-provided APK guide'
        run: |
          python tools/worldbox-xianxia/package_android_mono_source.py \
            --source tools/worldbox-xianxia/nml-observer-v07/Code/XianxiaObserverV07.cs \
            --extra-source tools/worldbox-xianxia/ui/SharedPanelsV30.cs \
            --extra-source tools/worldbox-xianxia/economy-v35/EconomyVanillaTabsV35.cs \
            --extra-source tools/worldbox-xianxia/ui/NativeWorldBoxUiV32.cs \
            --extra-source tools/worldbox-xianxia/ui/PixelFrameV30.cs \
            --extra-source tools/worldbox-xianxia/localization/ChineseWorldNamesV30.cs \
            --extra-source tools/worldbox-xianxia/huge-map-mod/GiantMapOptionsV11.cs \
            --extra-source tools/worldbox-xianxia/huge-map-mod/ObserverFrameGuardV12.cs \
            --extra-source tools/worldbox-xianxia/ui/ModTextAccessibilityV13.cs \
            --extra-source tools/worldbox-xianxia/gameplay/CultivationV18.cs \
            --extra-source tools/worldbox-xianxia/ui/ChineseModManagerV21.cs \
            --extra-source tools/worldbox-xianxia/localization/ChineseLocalizationV22.cs \
            --extra-source tools/worldbox-xianxia/localization/RuntimeChineseOverlayV22.cs \
            --extra-source tools/worldbox-xianxia/localization/OriginalMenuGuideV22.cs \
            --extra-source tools/worldbox-xianxia/localization/ChineseMenuGlossaryV23.cs \
            --extra-source tools/worldbox-xianxia/localization/NativeLocaleBridgeV23.cs \
            --extra-source tools/worldbox-xianxia/localization/UntranslatedMenuAuditV23.cs \
            --extra-source tools/worldbox-xianxia/localization/ChineseKeyPackV24.cs \
            --extra-source tools/worldbox-xianxia/localization/ChineseTextTemplatesV24.cs \
            --extra-source tools/worldbox-xianxia/localization/OwnLocaleLabelsV25.cs \
            --manifest tools/worldbox-xianxia/nml-observer-v07/mod.json \
            --out /tmp/worldbox_v22_android_mono_source_DEVICE_PENDING.zip \
            --locales tools/worldbox-xianxia/localization/nml-locales
      - name: 'Validate legacy source-only MOD contains no third-party DLL'
        run: |
          python - <<'PY'
          import zipfile,json
          path='/tmp/worldbox_v22_android_mono_source_DEVICE_PENDING.zip'
          with zipfile.ZipFile(path) as z:
              root='Mods/WorldBoxXianxiaObserver/'
              files=z.namelist()
              assert root+'Code/XianxiaObserverV07.cs' in files
              assert root+'Code/GiantMapOptionsV11.cs' in files
              assert root+'Code/ObserverFrameGuardV12.cs' in files
              assert root+'Code/ModTextAccessibilityV13.cs' in files
              assert root+'Code/CultivationV18.cs' in files
              assert root+'Code/EconomyVanillaTabsV35.cs' in files
              assert root+'Code/ChineseModManagerV21.cs' in files
              assert root+'Code/ChineseLocalizationV22.cs' in files
              assert root+'Code/RuntimeChineseOverlayV22.cs' in files
              assert root+'Code/OriginalMenuGuideV22.cs' in files
              assert root+'Code/ChineseMenuGlossaryV23.cs' in files
              assert root+'Code/NativeLocaleBridgeV23.cs' in files
              assert root+'Code/UntranslatedMenuAuditV23.cs' in files
              assert root+'Code/ChineseKeyPackV24.cs' in files
              assert root+'Code/ChineseTextTemplatesV24.cs' in files
              assert root+'Code/OwnLocaleLabelsV25.cs' in files
              for lang in ('cz', 'en'):
                  path=root+'Locales/'+lang+'.json'
                  assert path in files, path
                  locale=json.loads(z.read(path))
                  assert 'xinyanshuo.wb.mod_manager' in locale
                  assert 'xinyanshuo.wb.one_tap_chinese' in locale
              assert json.loads(z.read(root+'mod.json'))['ModType']==0
              assert all(not p.lower().endswith(('.apk','.dll','.pck')) for p in files)
              assert z.testzip() is None
          print('PASS_LEGACY_MONO_SOURCE_CANDIDATE; Android runtime DEVICE_PENDING')
          PY
      - name: 'Unpack/verify real candidate has mod.json and exactly one first-level compiled DLL'
        run: |
          python - <<'PY'
          import io, json, zipfile, hashlib
          from pathlib import Path
          x=Path('/tmp/worldbox_v22_android_nml_mod_DEVICE_PENDING.zip')
          with zipfile.ZipFile(x) as z:
              entries=z.namelist()
              root='NMLMods/WorldBoxXianxiaObserver'
              meta=json.loads(z.read(root+'/mod.json'))
              assert meta['ModType']==1 and meta['targetGameBuild']==725
              assert meta['GUID']=='XINYANSHUO_WORLD_BOX_OBSERVER_V07'
              dll=[s for s in entries if s.endswith('.dll')]
              assert dll==[root+'/'+meta['GUID']+'.dll'],dll
              checksum=z.read('SHA256SUMS.txt').decode()
              assert hashlib.sha256(z.read(dll[0])).hexdigest() in checksum
              assert 'README_INSTALL_DEVICE_PENDING.txt' in entries
              for lang in ('cz', 'en'):
                  path=root+'/Locales/'+lang+'.json'
                  assert path in entries
                  translations=json.loads(z.read(path))
                  assert translations['xinyanshuo.wb.mod_manager']
                  assert translations['xinyanshuo.wb.one_tap_chinese']
              assert len(entries)==6,entries
              print('PASS_NML_PRECOMPILED_LOAD_LAYOUT - Android device loading still PENDING')
          PY
      - name: 'Produce cautious Snapdragon 8 Elite world-size pressure candidates'
        run: |
          python tools/worldbox-xianxia/world_size_planner.py --device 'Snapdragon 8 Elite' --out /tmp/worldbox-v22-MAP_SIZE_CANDIDATES.json
      - name: 'Prepare testing bundle with source reference, no WorldBox APK or third-party DLL'
        run: |
          mkdir -p /tmp/worldbox-v22-artifacts
          cp /tmp/worldbox_v22_android_nml_mod_DEVICE_PENDING.zip /tmp/worldbox-v22-artifacts/
          cp /tmp/worldbox_v22_android_mono_source_DEVICE_PENDING.zip /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/nml-observer-v07/Code/XianxiaObserverV07.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/huge-map-mod/GiantMapOptionsV11.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/huge-map-mod/ObserverFrameGuardV12.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/ui/NativeWorldBoxUiV32.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/economy-v35/EconomyVanillaTabsV35.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/ui/ModTextAccessibilityV13.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/gameplay/CultivationV18.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/ChineseLocalizationV22.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/RuntimeChineseOverlayV22.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/OriginalMenuGuideV22.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/ChineseMenuGlossaryV23.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/NativeLocaleBridgeV23.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/UntranslatedMenuAuditV23.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/ChineseKeyPackV24.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/ChineseTextTemplatesV24.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/localization/OwnLocaleLabelsV25.cs /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/private_stage_mono_v28.py /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/test_v28_private_stage.py /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/releases/v0.28/PUBLIC_RELEASE_MANIFEST.json /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/releases/v0.28/README.md /tmp/worldbox-v22-artifacts/README_v028_SOURCE_ONLY.md
          mkdir -p /tmp/worldbox-v22-artifacts/NMLLocales
          cp tools/worldbox-xianxia/localization/nml-locales/cz.json /tmp/worldbox-v22-artifacts/NMLLocales/
          cp tools/worldbox-xianxia/localization/nml-locales/en.json /tmp/worldbox-v22-artifacts/NMLLocales/
          cp /tmp/WORLDBOX_PUBLIC_LOCALE_TYPES.json /tmp/worldbox-v22-artifacts/
          cp tools/worldbox-xianxia/nml-observer-v07/mod.json /tmp/worldbox-v22-artifacts/
          cp /tmp/WORLDBOX_PUBLIC_MAP_TYPES.json /tmp/worldbox-v22-artifacts/
          cp /tmp/worldbox-v22-MAP_SIZE_CANDIDATES.json /tmp/worldbox-v22-artifacts/
          printf '%s\n' 'WorldBox third-party MOD test; completely unrelated to original Canglan game.' 'Requires user-owned Android installation with verified NML bootstrap. DEVICE_PENDING.' 'NMLMods folder in zipped candidate is derived from official Android ModLoader Paths.ModsPath.' > /tmp/worldbox-v22-artifacts/README.txt
      - name: 'v0.28 public artifact safety: no commercial APK or signing secrets'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path('/tmp/worldbox-v22-artifacts')
          meta=json.loads((root/'PUBLIC_RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          assert meta['private_apk']['public_uploaded'] is False
          forbidden={'.apk','.aab','.pck','.jks','.keystore','.p12','.pfx','.idsig'}
          assert not [x for x in root.rglob('*') if x.is_file() and x.suffix.lower() in forbidden]
          for f in root.glob('*.zip'):
            with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              assert not [x for x in z.namelist() if Path(x).suffix.lower() in forbidden]
          print('PASS_PUBLIC_SOURCE_ONLY_NO_GAME_APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'worldbox-v22-NMLMods-precompiled-original-CANDIDATE'
          path: /tmp/worldbox-v22-artifacts/
          if-no-files-found: error
          retention-days: 14

  private-user-file-apk-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 'Build standalone generic Mono DLL IL inspector/patcher for locally owned APK files'
        run: |
          dotnet publish tools/worldbox-xianxia/private-apk-lab/GameAssemblyToolkit.csproj \
            -r linux-x64 -c Release --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false -o /tmp/worldbox-user-private-helper
          test -f /tmp/worldbox-user-private-helper/GameAssemblyToolkit
          dotnet build tools/worldbox-xianxia/private-apk-lab/MapPresetBridgeV32/WorldBoxXianxiaMapPreset.csproj -c Release --verbosity quiet
          cp tools/worldbox-xianxia/private-apk-lab/MapPresetBridgeV32/bin/Release/netstandard2.1/WorldBoxXianxiaMapPreset.dll /tmp/worldbox-user-private-helper/
          cp tools/worldbox-xianxia/private-apk-lab/MapPresetBridgeV32/MapPresetBridgeV32.cs /tmp/worldbox-user-private-helper/
          dotnet build tools/worldbox-xianxia/economy-v35/WorldBoxXianxiaEconomy.csproj -c Release --verbosity quiet
          cp tools/worldbox-xianxia/economy-v35/bin/Release/netstandard2.1/WorldBoxXianxiaEconomy.dll /tmp/worldbox-user-private-helper/
          cp tools/worldbox-xianxia/economy-v35/EconomyKernelV35.cs /tmp/worldbox-user-private-helper/
          cp tools/worldbox-xianxia/economy-v35/EconomyUnityAdapterV35.cs /tmp/worldbox-user-private-helper/
          test -s /tmp/worldbox-user-private-helper/WorldBoxXianxiaEconomy.dll
          test -s /tmp/worldbox-user-private-helper/WorldBoxXianxiaMapPreset.dll
          dotnet build tools/worldbox-xianxia/stream-world-v41/WorldBoxXianxiaStreamGrid.csproj -c Release --verbosity quiet
          cp tools/worldbox-xianxia/stream-world-v41/bin/Release/netstandard2.1/WorldBoxXianxiaStreamGrid.dll /tmp/worldbox-user-private-helper/
          test -s /tmp/worldbox-user-private-helper/WorldBoxXianxiaStreamGrid.dll
          cp tools/worldbox-xianxia/private-apk-lab/XianxiaMonoBridge.cs /tmp/worldbox-user-private-helper/
          mkdir -p /tmp/worldbox-user-private-helper/NativeBridgeSources
          cp tools/worldbox-xianxia/private-apk-lab/XianxiaMonoBridge.cs tools/worldbox-xianxia/private-apk-lab/DiagnosticLog.cs tools/worldbox-xianxia/private-apk-lab/IntegratedModBootstrap.cs /tmp/worldbox-user-private-helper/NativeBridgeSources/
          cp tools/worldbox-xianxia/cultivation/CultivationBridgeV18.cs tools/worldbox-xianxia/cultivation/CultivationRulesV18.cs /tmp/worldbox-user-private-helper/NativeBridgeSources/
          cp tools/worldbox-xianxia/ui/SharedPanelsV30.cs tools/worldbox-xianxia/ui/PixelFrameV30.cs tools/worldbox-xianxia/localization/ChineseWorldNamesV30.cs /tmp/worldbox-user-private-helper/NativeBridgeSources/
          cp tools/worldbox-xianxia/huge-map-mod/GiantMapOptionsV11.cs tools/worldbox-xianxia/huge-map-mod/ObserverFrameGuardV12.cs /tmp/worldbox-user-private-helper/NativeBridgeSources/
          find /usr/share/dotnet/shared/Microsoft.NETCore.App -name netstandard.dll | sort -V | tail -1 | xargs -r -I '{}' cp '{}' /tmp/worldbox-user-private-helper/netstandard.dll
          find /usr/share/dotnet/shared/Microsoft.NETCore.App -name System.Runtime.dll | sort -V | tail -1 | xargs -r -I '{}' cp '{}' /tmp/worldbox-user-private-helper/System.Runtime.dll
          test -s /tmp/worldbox-user-private-helper/netstandard.dll
          test -n "${ANDROID_HOME:-}" || echo 'ANDROID_HOME unset; cannot include Android signing tool helper'
          for d in "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*; do
            if [ -f "$d/lib/apksigner.jar" ] && [ -x "$d/zipalign" ]; then
              cp "$d/lib/apksigner.jar" /tmp/worldbox-user-private-helper/apksigner.jar
              cp "$d/zipalign" /tmp/worldbox-user-private-helper/zipalign
            fi
          done
          if [ -f /tmp/worldbox-user-private-helper/apksigner.jar ]; then
            java -jar /tmp/worldbox-user-private-helper/apksigner.jar version
          fi
          echo 'NO user-owned APK or commercial game binaries uploaded to public GitHub.'
      - name: 'Compile Android launcher diagnostic export against installed Android SDK'
        run: |
          python - <<'PY'
          import glob,os,re,subprocess
          sdk=os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT','/usr/local/lib/android/sdk')
          jars=glob.glob(sdk+'/platforms/android-*/android.jar')
          assert jars,'Android SDK platform jar missing; launcher not validated'
          jar=max(jars,key=lambda p:tuple(map(int,re.findall(r'\d+',p.split('/')[-2]))))
          root='tools/worldbox-xianxia/private-apk-lab/'
          subprocess.run(['javac','-encoding','UTF-8','-source','8','-target','8',
                          '-cp',jar,'-d','/tmp/worldbox-diagnostics-classes',
                          root+'DiagnosticReport.java',root+'DiagnosticsActivity.java',
                          root+'ModDeployment.java',root+'ExternalModImporterV32.java',
                          root+'ModFormatV34.java'],check=True)
          from pathlib import Path
          import hashlib
          dexers=glob.glob(sdk+'/build-tools/*/d8')
          assert dexers,'Android d8 missing; no launcher DEX generated'
          d8=max(dexers,key=lambda p:tuple(map(int,re.findall(r'\d+',Path(p).parent.name))))
          output=Path('/tmp/worldbox-diagnostics-dex')
          output.mkdir(parents=True,exist_ok=True)
          classes=[str(p) for p in Path('/tmp/worldbox-diagnostics-classes').rglob('*.class')]
          subprocess.run([d8,'--lib',jar,'--min-api','23','--output',str(output)]+classes,check=True)
          dex=(output/'classes.dex').read_bytes()
          assert dex.startswith(b'dex\n'),'invalid DEX header'
          target=Path('/tmp/worldbox-user-private-helper/WorldBoxDiagnostics_classes5.dex')
          target.write_bytes(dex)
          target.with_suffix('.sha256').write_text(hashlib.sha256(dex).hexdigest()+'  '+target.name+'\n')
          print('PASS_ANDROID_DIAGNOSTICS_DEX; original launcher only, private APK still required')
          PY
          cp tools/worldbox-xianxia/private-apk-lab/DiagnosticReport.java /tmp/worldbox-user-private-helper/
          cp tools/worldbox-xianxia/private-apk-lab/DiagnosticsActivity.java /tmp/worldbox-user-private-helper/
