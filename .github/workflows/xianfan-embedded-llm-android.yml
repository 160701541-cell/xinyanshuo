name: Xianfan Android Native LLM Prototype
on:
  workflow_dispatch:
  push:
    branches:
      - xianfan/android-embedded-llm-prototype
    paths:
      - 'projects/xianfan-living-world/android-text/**'
      - '.github/workflows/xianfan-embedded-llm-android.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot export templates and Android SDK
        run: |
          for dir in /root/.local/share/godot/export_templates/*; do
            test -d "$dir" || continue
            name="$(basename "$dir")"
            mkdir -p "$HOME/.local/share/godot/export_templates/$name"
            cp -a "$dir/." "$HOME/.local/share/godot/export_templates/$name/"
          done
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.6.tres "$HOME/.config/godot/editor_settings-4.6.tres"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Install audited NobodyWho v12.1.0 binary release for Android and Linux
        run: |
          set -eu
          apt-get update -qq && apt-get install -y -qq curl unzip libvulkan1 libgomp1 libfontconfig1
          curl -fL --retry 3 --connect-timeout 20 "https://github.com/nobodywho-ooo/nobodywho/releases/download/nobodywho-godot-v12.1.0/nobodywho-godot-nobodywho-godot-v12.1.0.zip" -o /tmp/nobodywho-godot-v12.1.0.zip
          echo "77974f294a700d3294a0e2e05d3594f0fb69e207e7ed7cfa52f960c6a9690356  /tmp/nobodywho-godot-v12.1.0.zip" | sha256sum -c -
          unzip -q /tmp/nobodywho-godot-v12.1.0.zip -d /tmp/nobodywho-release
          find /tmp/nobodywho-release -name '*.gdextension' -print
          ext="$(find /tmp/nobodywho-release -type f -name '*.gdextension' | head -n 1)"
          test -n "$ext"
          src="$(dirname "$ext")"
          dest="projects/xianfan-living-world/android-text/addons/nobodywho"
          mkdir -p "$dest"
          cp -a "$src/." "$dest/"
          # Upstream Linux .so targets newer x86 instructions; CI is only packaging Android ARM64.
          # Remove Linux selector on CI to avoid SIGILL, keep Android extension libs intact.
          sed -i '/^[[:space:]]*linux[.]/d' "$dest"/*.gdextension
          echo "Native addon platform manifest:"
          cat "$dest"/*.gdextension
          if grep -E '^[[:space:]]*linux[.]' "$dest"/*.gdextension; then
            echo 'ERROR: Linux extension selector remains; CI CPU may SIGILL'
            exit 1
          fi
          find "$dest" -maxdepth 2 -type f | head -n 40
          test -s "$dest/$(basename "$ext")"
      - name: Import game with native extension
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://scripts/society_sim.gd > /tmp/society-parser.log 2>&1 || true
          echo "SOCIETY SCRIPT DIAGNOSTIC:"
          cat /tmp/society-parser.log
          godot --headless --path . --script res://scripts/world.gd > /tmp/world-parser.log 2>&1 || true
          echo "WORLD SCRIPT DIAGNOSTIC:"
          cat /tmp/world-parser.log
          godot --headless --path . --editor --import --quit > /tmp/native-import.log 2>&1
          cat /tmp/native-import.log
          if grep -E '(SCRIPT ERROR|Parse Error)' /tmp/native-import.log; then exit 1; fi
      - name: Verify addon manifest before export
        run: |
          cd projects/xianfan-living-world/android-text
          find addons/nobodywho -name '*.gdextension' -print
          godot --headless --path . --quit-after 30 > /tmp/native-test.log 2>&1
          cat /tmp/native-test.log
          if grep -E '(SCRIPT ERROR|Parse Error)' /tmp/native-test.log; then exit 1; fi
      - name: Verify existing game, NPC popup, and downloadable model control
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_world.gd > /tmp/native-game-tests.log 2>&1 || { cat /tmp/native-game-tests.log; exit 1; }
          cat /tmp/native-game-tests.log
          if grep -E '(SCRIPT ERROR|Parse Error|TEST FAILURE)' /tmp/native-game-tests.log; then exit 1; fi
          godot --headless --path . --script res://tests/test_ai.gd > /tmp/native-ai-tests.log 2>&1 || { cat /tmp/native-ai-tests.log; exit 1; }
          cat /tmp/native-ai-tests.log
          if grep -E '(SCRIPT ERROR|Parse Error|TEST FAILURE)' /tmp/native-ai-tests.log; then exit 1; fi
          godot --headless --path . --script res://tests/test_ui.gd > /tmp/native-ui-tests.log 2>&1 || { cat /tmp/native-ui-tests.log; exit 1; }
          cat /tmp/native-ui-tests.log
          if grep -E '(SCRIPT ERROR|Parse Error|TEST FAILURE)' /tmp/native-ui-tests.log; then exit 1; fi
      - name: Verify NPC continuity and answer grounding
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_dialogue_context.gd > /tmp/npc-continuity.log 2>&1
          cat /tmp/npc-continuity.log
          if grep -E '(SCRIPT ERROR|Parse Error|NPC CONTEXT FAIL)' /tmp/npc-continuity.log; then exit 1; fi
      - name: Verify large-model selection without downloading model weights
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_large_models.gd > /tmp/large-model-test.log 2>&1 || { cat /tmp/large-model-test.log; exit 1; }
          cat /tmp/large-model-test.log
          if grep -E '(SCRIPT ERROR|Parse Error|LARGE MODEL TEST:|PICKER FAILED)' /tmp/large-model-test.log; then exit 1; fi
      - name: Validate AI-directed plot progression and NPC memory
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_director.gd > /tmp/ai-director.log 2>&1 || { cat /tmp/ai-director.log; exit 1; }
          cat /tmp/ai-director.log
          if grep -E '(SCRIPT ERROR|Parse Error|DIRECTOR TEST FAILURE|DIRECTOR TESTS FAILED)' /tmp/ai-director.log; then exit 1; fi
      - name: Validate on-screen AI orchestration and streamed dialogue
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_ai_orchestration.gd > /tmp/ai-orchestration.log 2>&1 || { cat /tmp/ai-orchestration.log; exit 1; }
          cat /tmp/ai-orchestration.log
          if grep -E '(SCRIPT ERROR|Parse Error|AI ORCHESTRATION FAILURE|ORCHESTRATION FAILED)' /tmp/ai-orchestration.log; then exit 1; fi
      - name: Verify lossless NPC sidecar and context-window choices
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_npc_memory_store.gd > /tmp/npc-sidecar.log 2>&1 || { cat /tmp/npc-sidecar.log; exit 1; }
          cat /tmp/npc-sidecar.log
          if grep -E '(SCRIPT ERROR|Parse Error|NPC SIDECAR TEST FAILURE|MEMORY TESTS FAILED)' /tmp/npc-sidecar.log; then exit 1; fi
      - name: Verify living world simulation, economic conservation and persistence
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_autonomous_society.gd > /tmp/autonomous-world.log 2>&1 || { cat /tmp/autonomous-world.log; exit 1; }
          cat /tmp/autonomous-world.log
          if grep -E '(SCRIPT ERROR|Parse Error|SOCIETY TEST FAILURE|SOCIETY TESTS FAILED)' /tmp/autonomous-world.log; then exit 1; fi
      - name: Check dynamic prices, caravans, household aid and offline social continuity
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_socioeconomic_depth.gd > /tmp/social-depth.log 2>&1 || { cat /tmp/social-depth.log; exit 1; }
          cat /tmp/social-depth.log
          if grep -E '(SCRIPT ERROR|Parse Error|SOCIAL DEPTH TEST FAILURE|SOCIAL DEPTH TESTS FAILED)' /tmp/social-depth.log; then exit 1; fi
      - name: Verify lifetime professions, aging, death, inheritance, NPC biographies
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_npc_life_cycle.gd > /tmp/life-test.log 2>&1 || { cat /tmp/life-test.log; exit 1; }
          cat /tmp/life-test.log
          if grep -E '(SCRIPT ERROR|Parse Error|LIFECYCLE TEST FAILURE|NPC LIFE CYCLE TESTS FAILED)' /tmp/life-test.log; then exit 1; fi
      - name: Verify expanded named population, 168 real jobs, social identity and daily economy
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_civic_population.gd > /tmp/civic-population.log 2>&1 || { cat /tmp/civic-population.log; exit 1; }
          cat /tmp/civic-population.log
          if grep -E '(SCRIPT ERROR|Parse Error|CIVIC POPULATION FAILURE|CIVIC POPULATION TESTS FAILED)' /tmp/civic-population.log; then exit 1; fi
      - name: Verify model download resume, real progress and message auto-follow
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_download_resume.gd > /tmp/download-resume.log 2>&1 || { cat /tmp/download-resume.log; exit 1; }
          cat /tmp/download-resume.log
          if grep -E '(SCRIPT ERROR|Parse Error|GGUF DOWNLOAD TEST FAILURE|GGUF DOWNLOAD TESTS FAILED)' /tmp/download-resume.log; then exit 1; fi
      - name: Verify GGUF bytes, official SHA256 checks and corrupt-model rejection
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_download_integrity.gd > /tmp/download-integrity.log 2>&1 || { cat /tmp/download-integrity.log; exit 1; }
          cat /tmp/download-integrity.log
          if grep -E '(SCRIPT ERROR|Parse Error|DOWNLOAD INTEGRITY FAILURE|INTEGRITY TESTS FAILED)' /tmp/download-integrity.log; then exit 1; fi
      - name: Audit GDP value-added production and periodized economic accounts
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_economic_accounts.gd > /tmp/gdp-economy.log 2>&1 || { cat /tmp/gdp-economy.log; exit 1; }
          cat /tmp/gdp-economy.log
          if grep -E '(SCRIPT ERROR|Parse Error|GDP ACCOUNT TEST FAILURE|GDP ACCOUNT TESTS FAILED)' /tmp/gdp-economy.log; then exit 1; fi
      - name: Verify geography, postal correspondence and streamlined navigation
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_location_mail_ui.gd > /tmp/location-mail-ui.log 2>&1 || { cat /tmp/location-mail-ui.log; exit 1; }
          cat /tmp/location-mail-ui.log
          if grep -E '(SCRIPT ERROR|Parse Error|LOCATION MAIL UI FAILURE|LOCATION MAIL UI FAILED)' /tmp/location-mail-ui.log; then exit 1; fi
      - name: Verify authored NPC personalities and persistent fact history
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_narrative_db.gd > /tmp/narrative-db.log 2>&1 || { cat /tmp/narrative-db.log; exit 1; }
          cat /tmp/narrative-db.log
          if grep -E '(SCRIPT ERROR|Parse Error|NARRATIVE DB FAILURE)' /tmp/narrative-db.log; then exit 1; fi
      - name: Build APK with native local runtime
        run: |
          cd projects/xianfan-living-world/android-text
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path . --export-debug Android build/xianfan-canglan-native-llm.apk > /tmp/native-export.log 2>&1
          cat /tmp/native-export.log
          if grep -E '(SCRIPT ERROR|Parse Error)' /tmp/native-export.log; then exit 1; fi
          test -s build/xianfan-canglan-native-llm.apk
          unzip -l build/xianfan-canglan-native-llm.apk | grep -Ei "nobodywho.*\\.so|libnobodywho"
          sha256sum build/xianfan-canglan-native-llm.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xianfan-canglan-native-llm-test-apk
          path: |
            projects/xianfan-living-world/android-text/build/xianfan-canglan-native-llm.apk
            projects/xianfan-living-world/android-text/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
