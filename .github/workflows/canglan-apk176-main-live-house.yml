name: Canglan ACTUAL APK176 Main Live Instantiation - House Gate
on:
  push:
    branches: [main]
    paths:
      - 'logic-qa/apk176-export-fixture/verify_original_main_live_house.gd'
      - 'logic-qa/tools/verify_house_portal_content.gd'
      - 'game-source/apk176-ota177-candidate/scripts/hd2d_house_portal.gd'
      - 'game-source/apk176-ota177-candidate/scripts/hd2d_original_overlay_ota177.gd'
      - 'game-source/apk176-ota177-candidate/hd2d/courtyard/**'
      - 'logic-qa/tools/build_apk176_hd2d_overlay.gd'
      - '.github/workflows/canglan-apk176-main-live-house.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canglan-original-apk176-live-room-gate
  cancel-in-progress: true
jobs:
  original-main-live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Restore actual original APK176 exported resources without replacing fixtures with mocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results qa-stage/ota177/{scenes,scripts,hd2d/courtyard,hd2d/worldx}
          cp game-source/apk176-ota177-candidate/scenes/* qa-stage/ota177/scenes/
          cp game-source/apk176-ota177-candidate/scripts/* qa-stage/ota177/scripts/
          cp game-source/apk176-ota177-candidate/hd2d/courtyard/*.png qa-stage/ota177/hd2d/courtyard/
          cp -R game-source/apk176-ota177-candidate/hd2d/worldx/. qa-stage/ota177/hd2d/worldx/
          cp art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg qa-stage/ota177/hd2d/atlas_village_ota177.jpg
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          src=Path(json.loads(Path('android-preview/base-latest.json').read_text())['file'])
          root=Path('logic-qa/apk176-export-fixture')
          count=0
          total=0
          with ZipFile(src) as apk:
              for entry in apk.infolist():
                  if not entry.filename.startswith('assets/') or entry.is_dir():
                      continue
                  rel=Path(entry.filename[len('assets/'):])
                  if str(rel)=='project.godot':
                      continue  # Keep the deliberately minimal exported-runtime QA project config.
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('APK zip path traversal blocked')
                  if entry.file_size > 100_000_000:
                      raise SystemExit('Unexpected single APK asset > 100MB: '+str(rel))
                  dst=root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(apk.read(entry))
                  count+=1
                  total+=entry.file_size
          assert (root/'.godot/global_script_class_cache.cfg').is_file()
          assert (root/'shaders/atmosphere/layered_cloud_sky.gdshader').is_file()
          print('PASS_REAL_APK176_FULL_EXPORTED_ASSET_FIXTURE',count,'files',total,'bytes')
          descriptor=root/'addons/terrain_3d/terrain.gdextension'
          if descriptor.is_file():
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_START')
              print(descriptor.read_text(encoding='utf-8',errors='replace')[:11000])
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_END')
          else:
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_MISSING')
          with ZipFile(src) as apk:
              for n in apk.namelist():
                  if 'terrain' in n.lower() and (n.endswith('.so') or n.endswith('.gdextension') or n.endswith('.dll') or n.endswith('.dylib')):
                      print('APK176_NATIVE_TERRAIN_ENTRY',n)
          print('PASS_APK_NATIVE_TERRAIN_DIAGNOSTIC')
          PY
      - name: Recover exact-matching Terrain3D Linux QA plugin from trusted upstream releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          src=pathlib.Path(json.loads(pathlib.Path('android-preview/base-latest.json').read_text())['file'])
          with zipfile.ZipFile(src) as apk:
              name='lib/arm64-v8a/libterrain.android.debug.arm64.so'
              assert name in apk.namelist(), 'Actual APK176 Terrain3D Android native binary missing'
              raw=apk.read(name)
          pathlib.Path('/tmp/canglan-actual-android-terrain.so').write_bytes(raw)
          print('APK176_REAL_ANDROID_TERRAIN_SHA256',hashlib.sha256(raw).hexdigest(),'size',len(raw))
          PY
          for version in v1.0.1-stable v1.0.2-stable; do
            case "$version" in
              v1.0.1-stable) archive=Terrain3D_v1.0.1.zip ;;
              v1.0.2-stable) archive=Terrain3D_v1.0.2-stable.zip ;;
            esac
            if ! curl -fL --retry 2 --connect-timeout 15 --max-time 110 \
              "https://github.com/TokisanGames/Terrain3D/releases/download/$version/$archive" -o /tmp/upstream-terrain.zip; then
              echo "UPSTREAM_TERRAIN_DOWNLOAD_UNAVAILABLE $version"
              continue
            fi
            if CANGLAN_TERRAIN_VERSION="$version" python3 - <<'PY'
          import hashlib,os,zipfile,pathlib,sys
          expected=hashlib.sha256(pathlib.Path('/tmp/canglan-actual-android-terrain.so').read_bytes()).hexdigest()
          z=zipfile.ZipFile('/tmp/upstream-terrain.zip')
          names=z.namelist()
          android=[n for n in names if n.endswith('libterrain.android.debug.arm64.so')]
          linux=[n for n in names if n.endswith('libterrain.linux.debug.x86_64.so')]
          if not android or not linux:
              print('TERRAIN_RELEASE_MISSING_PLATFORM_BINARY',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          actual=hashlib.sha256(z.read(android[0])).hexdigest()
          print('UPSTREAM_TERRAIN_ANDROID_SHA256',os.environ['CANGLAN_TERRAIN_VERSION'],actual)
          if actual!=expected:
              print('NO_PROVEN_SAME_PLUGIN_VERSION',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          target=pathlib.Path('logic-qa/apk176-export-fixture/addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so')
          target.parent.mkdir(parents=True,exist_ok=True)
          data=z.read(linux[0])
          target.write_bytes(data)
          print('PASS_EXACT_APK176_NATIVE_TERRAIN_VERSION_MATCHED_AND_LINUX_QA_LIBRARY_STAGED',
                os.environ['CANGLAN_TERRAIN_VERSION'],'LinuxBytes',len(data))
          PY
            then
              echo "MATCHED_NATIVE_TERRAIN_VERSION=$version" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${MATCHED_NATIVE_TERRAIN_VERSION:-}" ] && ! grep -q '^MATCHED_NATIVE_TERRAIN_VERSION=' "$GITHUB_ENV"; then
            echo 'BLOCKED: neither upstream release Android binary exactly matches APK176; no substitute DLL was injected'
          fi
      - name: Install actual Godot 4.4.1 engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Make exact same-game temporary PCK, unsigned
        env:
          CANGLAN_OTA_STAGE_DIR: ${{ github.workspace }}/qa-stage/ota177
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-live-house-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path logic-qa --import > qa-results/live-house-import.log 2>&1
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa \
            --script res://tools/build_apk176_hd2d_overlay.gd > qa-results/live-house-pck-build.log 2>&1
          cat qa-results/live-house-pck-build.log
          python3 tools/verify_hd2d_overlay_pck.py "$CANGLAN_QA_PCK_PATH" > qa-results/live-house-pck-index.log
      - name: ACTUALLY instantiate original compiled Main with courtyard and enter/exit room
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-live-house-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path logic-qa/apk176-export-fixture \
            --script res://verify_original_main_live_house.gd > qa-results/live-main-room-runtime.log 2>&1 || {
              tail -100 qa-results/live-main-room-runtime.log
              exit 1
            }
          tail -90 qa-results/live-main-room-runtime.log
          grep -Fq 'OBSERVED_APK176_MAIN_INSTANCE_WITH_PORTAL_AND_IMAGES_PENDING_ENGINE_ERROR_AUDIT' qa-results/live-main-room-runtime.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|Failed loading resource' qa-results/live-main-room-runtime.log; then
            echo '::error::BLOCKED_FULL_MAIN_RUNTIME: native Terrain3D GDExtension and/or original gameplay errors; observed component transitions alone do not qualify as a full PASS'
            exit 1
          fi
          echo 'PASS_APK176_ACTUAL_MAIN_INSTANTIATED_NO_ENGINE_ERRORS_WITH_REAL_HOUSE'
      - name: Prepare revision177 UNSIGNED handoff; independently prove only release RSA signature is missing
        shell: bash
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-live-house-UNSIGNED.pck
        run: |
          set -euo pipefail
          python3 logic-qa/release-gate/sign_pck_release.py \
            --pack "$CANGLAN_QA_PCK_PATH" \
            --revision 177 \
            --minimum-android-code 1176 \
            --maximum-android-code 1176 \
            --pack-url 'https://160701541-cell.github.io/xinyanshuo/android-preview/canglan-content-rev-177.pck' \
            --notes '苍岚原版：WorldX真实地图、正房室外室内及进出功能候选' \
            --unsigned-template \
            --output qa-results/canglan-rev177-UNSIGNED-NOT-FOR-PHONE.json
          python3 tools/ota_release_gate.py \
            --candidate qa-results/canglan-rev177-UNSIGNED-NOT-FOR-PHONE.json \
            --pck "$CANGLAN_QA_PCK_PATH" \
            --report qa-results/ota-rev177-UNSIGNED-gate-report.json \
            > qa-results/ota-rev177-gate-output.log 2>&1 && {
              echo '::error::Unsigned candidate unexpectedly passed an RSA release gate'; exit 1;
            }
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          result=json.loads(pathlib.Path('qa-results/ota-rev177-UNSIGNED-gate-report.json').read_text())
          bad=result['candidate']['errors']
          assert bad == ['RSA signature DOES NOT match immutable public key in installed APK'], bad
          assert result['required_next_revision']==177
          m=json.loads(pathlib.Path('qa-results/canglan-rev177-UNSIGNED-NOT-FOR-PHONE.json').read_text())
          assert m['revision']==177 and m['minimum_android_code']==1176
          assert m['maximum_android_code']==1176 and m['signature']==''
          assert m['_not_a_release']=='UNSIGNED_DEVELOPER_TEMPLATE_DO_NOT_HOST'
          print('PASS_REV177_PACK_BYTES_VERSION_RANGE_AND_UNSIGNED_RSA_SAFETY_GATE',
                m['sha256'],m['size_bytes'])
          print('RELEASE_BLOCKER_ONLY_ORIGINAL_APK_RSA_PRIVATE_KEY')
          PY
      - name: Preserve full real original-game QA, unsigned PCK and sealed-for-signer metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-APK176-TRUE-MAIN-QA-rev177-UNSIGNED-NOT-FOR-PHONE
          path: |
            qa-results/live-*.log
            qa-results/live-house-pck-index.log
            qa-results/canglan-apk176-live-house-UNSIGNED.pck
            qa-results/canglan-rev177-UNSIGNED-NOT-FOR-PHONE.json
            qa-results/ota-rev177-UNSIGNED-gate-report.json
            qa-results/ota-rev177-gate-output.log
          if-no-files-found: warn
          retention-days: 14
