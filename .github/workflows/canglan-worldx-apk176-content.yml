name: Canglan WorldX art into ORIGINAL APK176 PCK (real image import)
on:
  push:
    branches: [main]
    paths:
      - 'tools/asset_factory/worldx_godot_bridge.py'
      - 'game-source/apk176-ota177-candidate/**'
      - 'logic-qa/tools/build_apk176_hd2d_overlay.gd'
      - 'tools/verify_hd2d_overlay_pck.py'
      - '.github/workflows/canglan-worldx-apk176-content.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  worldx-original-pck:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Read exact published APK176 and stage existing game content
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_apk176_hd2d_hooks.py --out qa-results/apk176-hd2d-entrypoints.json
          mkdir -p qa-stage/ota177/{hd2d/worldx,scripts,scenes}
          cp game-source/apk176-ota177-candidate/scenes/* qa-stage/ota177/scenes/
          cp game-source/apk176-ota177-candidate/scripts/* qa-stage/ota177/scripts/
          cp art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg qa-stage/ota177/hd2d/atlas_village_ota177.jpg
      - name: Download genuine MIT WorldX sample artwork (not generated by this CI)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/YGYOOO/WorldX.git /tmp/WorldX
          test "$(head -n1 /tmp/WorldX/LICENSE)" = "MIT License"
          git -C /tmp/WorldX rev-parse HEAD > qa-results/WORLDX_SOURCE_COMMIT.txt
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 tools/asset_factory/worldx_godot_bridge.py \
            --source /tmp/WorldX/library/worlds \
            --out qa-stage/ota177/hd2d/worldx --limit 8 --map-only
          python3 tools/asset_factory/worldx_npc_import.py \
            --source /tmp/WorldX/library/worlds \
            --out qa-stage/ota177/hd2d/worldx/npcs --limit 6
          test -s qa-stage/ota177/hd2d/worldx/npcs/npcs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("qa-stage/ota177/hd2d/worldx/npcs/npcs.json").read_text())
          assert len(cfg["characters"])>=5, "WorldX source NPC set incomplete"
          assert all(ch["columns"]*ch["rows"]>=21 for ch in cfg["characters"])
          print("PASS_REAL_WORLDX_NPC_METADATA",len(cfg["characters"]))
          PY
          test -s qa-stage/ota177/hd2d/worldx/worldx_000.png
          cat qa-stage/ota177/hd2d/worldx/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("qa-stage/ota177/hd2d/worldx/manifest.json").read_text())
          assert len(data["assets"])>=1
          assert all("/map/" in ("/"+a["source"]) for a in data["assets"]), "No non-map spritesheets allowed"
          print("PASS_WORLDX_MAP_ONLY_2D_IMAGES", len(data["assets"]))
          PY
      - name: Commit authentic WorldX PNGs into ORIGINAL public game repository
        shell: bash
        run: |
          set -euo pipefail
          target=game-source/apk176-ota177-candidate/hd2d/worldx
          mkdir -p "$target"
          cp qa-stage/ota177/hd2d/worldx/*.png "$target/"
          cp qa-stage/ota177/hd2d/worldx/manifest.json "$target/manifest.json"
          mkdir -p "$target/npcs"
          cp qa-stage/ota177/hd2d/worldx/npcs/*.png "$target/npcs/"
          cp qa-stage/ota177/hd2d/worldx/npcs/npcs.json "$target/npcs/npcs.json"
          printf 'WorldX samples: https://github.com/YGYOOO/WorldX (MIT).\nSource commit: %s\nImages are upstream samples, not generated by Canglan.\nVisual QA: CANDIDATE_NOT_VISUALLY_APPROVED\n' "$(cat qa-results/WORLDX_SOURCE_COMMIT.txt)" > "$target/UPSTREAM_LICENSE_AND_PROVENANCE.txt"
          git config user.name "canglan-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "art: actual WorldX MIT maps for original Canglan game [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'WorldX PNG assets already committed'
          fi
      - name: Read original APK176 compiled GDScripts for real fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile,pathlib
          src=json.load(open("android-preview/base-latest.json"))["file"]
          out=pathlib.Path("logic-qa/apk176-export-fixture")
          with zipfile.ZipFile(src) as zip:
              for p in zip.namelist():
                  if p.startswith("assets/scripts/") and p.endswith((".gdc",".gd.remap")):
                      dst=out / p[len("assets/"):]
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(zip.read(p))
                  elif p in ("assets/scenes/main.tscn.remap",
                            "assets/.godot/exported/133200997/export-3ad5c15c4f3250da0cc7c1af1770d85f-main.scn"):
                      dst=out / p[len("assets/"):]
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(zip.read(p))
          PY
      - name: Install Godot 4.4.1 engine
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Build Godot update pack containing WorldX image and actual game content
        shell: bash
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-rev177-worldx-UNSIGNED-QA-ONLY.pck
          CANGLAN_OTA_STAGE_DIR: ${{ github.workspace }}/qa-stage/ota177
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.4.1-stable_linux.x86_64
          timeout 75s "$GODOT" --headless --editor --path logic-qa --import > qa-results/worldx-godot-import.log 2>&1
          timeout 75s "$GODOT" --headless --path logic-qa \
            --script res://tools/build_apk176_hd2d_overlay.gd > qa-results/worldx-pck-build.log 2>&1
          cat qa-results/worldx-pck-build.log
          python3 tools/verify_hd2d_overlay_pck.py "$CANGLAN_QA_PCK_PATH" | tee qa-results/worldx-pck-index.log
          grep -Fq 'HD2D_OTA_INDEX_ENTRY hd2d/worldx/worldx_000.png' qa-results/worldx-pck-index.log
          grep -Fq 'HD2D_OTA_INDEX_ENTRY hd2d/worldx/npcs/npc_00.png' qa-results/worldx-pck-index.log
          grep -Fq 'HD2D_OTA_INDEX_ENTRY hd2d/worldx/npcs/npcs.json' qa-results/worldx-pck-index.log
      - name: Load original compiled main game with new WorldX texture PCK
        shell: bash
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-rev177-worldx-UNSIGNED-QA-ONLY.pck
        run: |
          set -euo pipefail
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path logic-qa/apk176-export-fixture \
            --script res://verify_hd2d_scene_override.gd > qa-results/worldx-in-game-scene-load.log 2>&1
          cat qa-results/worldx-in-game-scene-load.log
          grep -Fq 'PASS_APK176_HD2D_OVERLAY_MOUNT_AND_CANONICAL_MAIN_SCENE' qa-results/worldx-in-game-scene-load.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script' qa-results/worldx-in-game-scene-load.log; then
            echo '::error::Original compiled APK game classes unavailable in QA; cannot claim this scene passes'
            exit 1
          fi
          echo 'PASS_WORLDX_REAL_IMAGES_AND_NPCS_PACKED (NOT SIGNED / NOT PHONE OTA)'
      - name: Preserve actual generated assets and full game content PCK (not phone-ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-WorldX-ORIGINAL-APK176-Content-Candidate-${{ github.sha }}
          path: |
            qa-results/*
            qa-stage/ota177/hd2d/worldx/*.png
            qa-stage/ota177/hd2d/worldx/npcs/*.png
            qa-stage/ota177/hd2d/worldx/npcs/npcs.json
            qa-stage/ota177/hd2d/worldx/manifest.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
