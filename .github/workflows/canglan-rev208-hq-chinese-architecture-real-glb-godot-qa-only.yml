name: Canglan rev208 HQ Chinese CC0 Pavilion Moongate TRUE GLB Godot 4.4.1 QA ONLY
on:
  workflow_dispatch:
  push:
    branches: [feat/rev208-green-kenney-saplings-vegetation]
    paths:
      - '.github/workflows/canglan-rev208-hq-chinese-architecture-real-glb-godot-qa-only.yml'
      - 'tools/asset_factory/rev208_convert_cc0_chinese_fbx_to_glb.py'
      - 'tools/asset_factory/rev208_verify_chinese_gltf_godot441.gd'
permissions:
  contents: read
jobs:
  convert-source-to-author-real-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch both pinned verified official CC0 Chinese FBX archives - source material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-architecture/pinned qa-architecture/actual-glb qa-architecture/proof
          curl -fLsS --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            'https://store.godotengine.org/asset/vvaytoyek/chinese-four-corner-pavilion-free/download/1144/' \
            -o qa-architecture/pinned/chinese_four_corner_pavilion.zip
          curl -fLsS --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/download/1167/' \
            -o qa-architecture/pinned/chinese_classical_garden_wall.zip
          echo '008fb5c4508ce57c4203e5763fd01a177ded16ca94fd5de34ea26c422b483efa  qa-architecture/pinned/chinese_four_corner_pavilion.zip' | sha256sum -c -
          echo '49478a1d43f1e4b11e6dc3d1e977011cdbba5a7b77ee56890f586166697da38e  qa-architecture/pinned/chinese_classical_garden_wall.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for n in ('chinese_four_corner_pavilion','chinese_classical_garden_wall'):
            source=Path('qa-architecture/pinned')/(n+'.zip')
            dst=Path('qa-architecture/pinned')/n
            dst.mkdir()
            with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              model_files=[i for i in z.infolist()
                if i.filename.lower().endswith('.fbx')]
              assert len(model_files)==1,(n,[i.filename for i in model_files])
              for item in z.infolist():
                parts=Path(item.filename).parts
                assert not Path(item.filename).is_absolute() and '..' not in parts
              z.extractall(dst)
            print('PASS_PINNED_REAL_AUTHOR_FBXS',n,model_files[0].filename,flush=True)
          PY
      - name: Install actual Blender FBX converter (no fabricated meshes)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends blender
          blender --version | head -3
      - name: Convert both real author FBX models to Godot GLB2 retaining source UV topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for n in ('chinese_four_corner_pavilion','chinese_classical_garden_wall'):
            root=Path('qa-architecture/pinned')/n
            sources=list(root.rglob('*.fbx'))
            assert len(sources)==1,(n,sources)
            destination=Path('qa-architecture/actual-glb')/(n+'.glb')
            report=Path('qa-architecture/proof')/(n+'.json')
            result=subprocess.run(['blender','-b','-noaudio',
              '--python','tools/asset_factory/rev208_convert_cc0_chinese_fbx_to_glb.py',
              '--','--input='+str(sources[0].resolve()),
              '--output='+str(destination.resolve()),
              '--manifest='+str(report.resolve())],check=False,
              timeout=540)
            assert result.returncode==0,(n,result.returncode)
            assert destination.is_file() and report.is_file()
            print('PASS_REV208_REAL_CHINESE_FBX_GLTF_CONVERTED_AUTHOR_MATERIALS',n,
                  destination.stat().st_size,flush=True)
          PY
      - name: Validate native Godot 4.4.1 GLTFDocument real mesh UV PBR import
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip' \
            -o /tmp/godot4.4.1-chinese.zip
          unzip -q /tmp/godot4.4.1-chinese.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p qa-architecture/godot-project
          printf '[application]\nconfig/name="CC0 Source Asset Import QA Only"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > qa-architecture/godot-project/project.godot
          CANGLAN_CHINESE_SOURCE_DIR="$GITHUB_WORKSPACE/qa-architecture/actual-glb" \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path qa-architecture/godot-project \
            -s "$GITHUB_WORKSPACE/tools/asset_factory/rev208_verify_chinese_gltf_godot441.gd" \
            2>&1 | tee qa-architecture/proof/godot441_import.log
          grep -Fq 'PASS_REV208_CHINESE_PAVILION_AND_MOONGATE_REAL_3D_GODOT_SOURCE_IMPORT_QUARANTINED_NOT_GAME_ART_ACCEPTED' qa-architecture/proof/godot441_import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_REV208' qa-architecture/proof/godot441_import.log; then
            cat qa-architecture/proof/godot441_import.log; exit 1
          fi
      - name: Preserve genuine converted source GLBs and provenance for P0 ART decision, never sign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-REV208-CHINESE-COURTYARD-TRUE-GLB-GODOT441-UNAPPROVED-NO-OTA
          path: |
            qa-architecture/actual-glb/*.glb
            qa-architecture/proof/*.json
            qa-architecture/proof/godot441_import.log
          if-no-files-found: warn
          retention-days: 7
