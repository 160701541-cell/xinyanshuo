name: Canglan rev208 HQ Chinese CC0 Pavilion Moongate TRUE GLB Godot 4.4.1 QA ONLY
on:
  workflow_dispatch:
  push:
    branches: [feat/rev208-green-kenney-saplings-vegetation]
    paths:
      - '.github/workflows/canglan-rev208-hq-chinese-architecture-real-glb-godot-qa-only.yml'
      - 'tools/asset_factory/rev208_convert_cc0_chinese_fbx_to_glb.py'
      - 'tools/asset_factory/rev208_verify_chinese_gltf_godot441.gd'
permissions:
  contents: write
jobs:
  convert-source-to-author-real-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch both pinned verified official CC0 Chinese FBX archives - source material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-architecture/pinned qa-architecture/actual-glb qa-architecture/proof
          curl -fLsS --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            'https://store.godotengine.org/asset/vvaytoyek/chinese-four-corner-pavilion-free/download/1144/' \
            -o qa-architecture/pinned/chinese_four_corner_pavilion.zip
          curl -fLsS --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/download/1167/' \
            -o qa-architecture/pinned/chinese_classical_garden_wall.zip
          echo '008fb5c4508ce57c4203e5763fd01a177ded16ca94fd5de34ea26c422b483efa  qa-architecture/pinned/chinese_four_corner_pavilion.zip' | sha256sum -c -
          echo '49478a1d43f1e4b11e6dc3d1e977011cdbba5a7b77ee56890f586166697da38e  qa-architecture/pinned/chinese_classical_garden_wall.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for n in ('chinese_four_corner_pavilion','chinese_classical_garden_wall'):
            source=Path('qa-architecture/pinned')/(n+'.zip')
            dst=Path('qa-architecture/pinned')/n
            dst.mkdir()
            with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              model_files=[i for i in z.infolist()
                if i.filename.lower().endswith('.fbx')]
              assert len(model_files)==1,(n,[i.filename for i in model_files])
              for item in z.infolist():
                parts=Path(item.filename).parts
                assert not Path(item.filename).is_absolute() and '..' not in parts
              z.extractall(dst)
            print('PASS_PINNED_REAL_AUTHOR_FBXS',n,model_files[0].filename,flush=True)
          PY
      - name: Install actual Blender FBX converter (no fabricated meshes)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends blender
          blender --version | head -3
          # Ubuntu's apt Blender FBX add-on imports NumPy but the default
          # headless package does not install a NumPy wheel in Blender's own
          # embedded CPython interpreter. Pin the exact ABI-compatible wheel.
          blender_minor="$(blender -b -noaudio --python-expr "import sys;print('CANGLAN_BLENDER_PY_MINOR='+str(sys.version_info.minor))" 2>&1 | grep -oE 'CANGLAN_BLENDER_PY_MINOR=[0-9]+' | tail -1 | cut -d= -f2)"
          test -n "$blender_minor"
          python3 -m pip install --quiet --no-deps --target /tmp/canglan-blender-python \
            --only-binary=:all: --python-version "3.$blender_minor" \
            --implementation cp --abi "cp3$blender_minor" 'numpy==1.26.4'
          PYTHONPATH=/tmp/canglan-blender-python blender -b -noaudio \
            --python-expr "import numpy;print('PASS_REV208_BLENDER_FBX_NUMPY_ABI='+numpy.__version__)" 2>&1 \
            | tee qa-architecture/proof/blender_imports.log
          grep -Fq 'PASS_REV208_BLENDER_FBX_NUMPY_ABI=1.26.4' qa-architecture/proof/blender_imports.log
      - name: Convert both real author FBX models to Godot GLB2 retaining source UV topology
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="/tmp/canglan-blender-python:${PYTHONPATH:-}"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          conversions=(
            ('chinese_four_corner_pavilion','chinese_four_corner_pavilion',''),
            ('chinese_classical_garden_wall','chinese_moongate_medium','月洞门1_中'),
            ('chinese_classical_garden_wall','chinese_garden_wall_medium_section','围墙_中_1段'),
          )
          for input_pack,output_name,only_object in conversions:
            root=Path('qa-architecture/pinned')/input_pack
            sources=list(root.rglob('*.fbx'))
            assert len(sources)==1,(input_pack,sources)
            destination=Path('qa-architecture/actual-glb')/(output_name+'.glb')
            report=Path('qa-architecture/proof')/(output_name+'.json')
            cmd=['blender','-b','-noaudio',
              '--python','tools/asset_factory/rev208_convert_cc0_chinese_fbx_to_glb.py',
              '--','--input='+str(sources[0].resolve()),
              '--output='+str(destination.resolve()),
              '--manifest='+str(report.resolve())]
            if only_object:
              cmd.append('--only-object='+only_object)
            result=subprocess.run(cmd,check=False,timeout=540)
            assert result.returncode==0,(input_pack,output_name,result.returncode)
            assert destination.is_file() and report.is_file()
            print('PASS_REV208_REAL_CHINESE_FBX_GLTF_CONVERTED_AUTHOR_MATERIALS',
                  output_name,destination.stat().st_size,flush=True)
          PY
      - name: Validate native Godot 4.4.1 GLTFDocument real mesh UV PBR import
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip' \
            -o /tmp/godot4.4.1-chinese.zip
          unzip -q /tmp/godot4.4.1-chinese.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p qa-architecture/godot-project
          printf '[application]\nconfig/name="CC0 Source Asset Import QA Only"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > qa-architecture/godot-project/project.godot
          CANGLAN_CHINESE_SOURCE_DIR="$GITHUB_WORKSPACE/qa-architecture/actual-glb" \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path qa-architecture/godot-project \
            -s "$GITHUB_WORKSPACE/tools/asset_factory/rev208_verify_chinese_gltf_godot441.gd" \
            2>&1 | tee qa-architecture/proof/godot441_import.log
          grep -Fq 'PASS_REV208_CHINESE_PAVILION_MOONGATE_AND_SINGLE_WALL_REAL_3D_GODOT_SOURCE_IMPORT_QUARANTINED_NOT_GAME_ART_ACCEPTED' qa-architecture/proof/godot441_import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_REV208' qa-architecture/proof/godot441_import.log; then
            cat qa-architecture/proof/godot441_import.log; exit 1
          fi
      - name: Pin 3 source-author Chinese GLB models into same Draft PR repository as QUARANTINED art only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Protect the working original game: do not claim mobile approval.
          # Never overwrite a newer commit with stale binary art artifacts.
          remote_sha="$(git ls-remote origin refs/heads/feat/rev208-green-kenney-saplings-vegetation | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "REV208_STALE_ARCHITECTURE_GLBS_IN_RUN_ARTIFACT_ONLY_NO_CROSS_COMMIT"
            exit 0
          fi
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          dst=Path('game-source/apk176-ota177-candidate/assets/hq-rev208/architecture-chinese-cc0')
          dst.mkdir(parents=True,exist_ok=True)
          specs={
            'chinese_four_corner_pavilion':{
              'original_download':'https://store.godotengine.org/asset/vvaytoyek/chinese-four-corner-pavilion-free/download/1144/',
              'original_zip_sha256':'008fb5c4508ce57c4203e5763fd01a177ded16ca94fd5de34ea26c422b483efa',
              'author_page':'https://store.godotengine.org/asset/vvaytoyek/chinese-four-corner-pavilion-free/',
              'shape':'7-part traditional four-sided Chinese tiled-roof pavilion with structural dougong and columns'},
            'chinese_moongate_medium':{
              'original_download':'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/download/1167/',
              'original_zip_sha256':'49478a1d43f1e4b11e6dc3d1e977011cdbba5a7b77ee56890f586166697da38e',
              'author_page':'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/',
              'shape':'isolated single real author circular moon-door wall module'},
            'chinese_garden_wall_medium_section':{
              'original_download':'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/download/1167/',
              'original_zip_sha256':'49478a1d43f1e4b11e6dc3d1e977011cdbba5a7b77ee56890f586166697da38e',
              'author_page':'https://store.godotengine.org/asset/vvaytoyek/chinese-classical-garden-wall/',
              'shape':'single genuine Chinese garden wall segment UV authored, not full 78-mesh catalog'}
          }
          report={'schema':208,'license':'CC0-1.0','copyright_holder':'VVaytoyek',
            'source_page_verified_run':39102085971,
            'native_godot_441_verified':True,
            'release_policy':'QA_ONLY_NOT_SIGNED_NOT_PUBLISHED',
            'P0_art_approved':False,'Android_real_device_30min':'NOT_TESTED',
            'original_world_main_scene_qa':'NOT_TESTED',
            'source_uv_layout_pngs_are_not_pbr_textures':True,
            'pbr_source':'CC0 Quaternius game material package ONLY IF APPLIED TO INGAME UV SOURCE',
            'assets':{}}
          for name,meta in specs.items():
            model=Path('qa-architecture/actual-glb')/(name+'.glb')
            proof=Path('qa-architecture/proof')/(name+'.json')
            assert model.is_file() and proof.is_file(),name
            row=json.loads(proof.read_text())
            content=model.read_bytes()
            assert content[:4]==b'glTF' and hashlib.sha256(content).hexdigest()==row['converted_glb_sha256']
            assert row['source_polygon_triangles']<= (125000 if name.endswith('pavilion') else 100000)
            assert row['source_uv_mesh_objects']>=1 and row['source_actual_mesh_objects']>=1
            shutil.copyfile(model,dst/model.name)
            report['assets'][name]={**meta,**row,'source_license':'CC0-1.0',
              'geometry_status':'NATIVE_GODOT441_GLTF_SOURCE_QA_PASS',
              'uv_pbr_game_approval':False}
          (dst/'manifest.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('PASS_REV208_CHINESE_CC0_3_AUTHENTIC_SOURCE_GLBS_SHA_TRI_MATERIALS_REPOSITORY_QUARANTINE')
          PY
          git config user.name 'canglan-qa-architecture[bot]'
          git config user.email 'canglan-qa-architecture[bot]@users.noreply.github.com'
          git add game-source/apk176-ota177-candidate/assets/hq-rev208/architecture-chinese-cc0/
          if git diff --cached --quiet; then
            echo "REV208_PINNED_CHINESE_GLB_QUARANTINE_ALREADY_IDENTICAL"
            exit 0
          fi
          git commit -m "art(rev208 HQ): add 3 genuine CC0 Chinese pavilion moon gate wall GLBs for original Main visual QA only"
          remote_after="$(git ls-remote origin refs/heads/feat/rev208-green-kenney-saplings-vegetation | cut -f1)"
          if [ "$remote_after" != "$GITHUB_SHA" ]; then
            echo "REV208_GIT_HEAD_CHANGED_NO_UNVERIFIED_BINARY_PUSH"
            exit 0
          fi
          git push origin HEAD:refs/heads/feat/rev208-green-kenney-saplings-vegetation
      - name: Preserve genuine converted source GLBs and provenance for P0 ART decision, never sign
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-REV208-CHINESE-COURTYARD-TRUE-GLB-GODOT441-UNAPPROVED-NO-OTA
          path: |
            qa-architecture/actual-glb/*.glb
            qa-architecture/proof/*.json
            qa-architecture/proof/godot441_import.log
          if-no-files-found: warn
          retention-days: 7
