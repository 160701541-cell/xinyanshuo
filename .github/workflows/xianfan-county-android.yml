name: Xianfan County | Independent Android prototype APK
on:
  push:
    branches:
      - 'xianfan/independent-living-county-v0.1'
    paths:
      - 'projects/xianfan-living-world/**'
      - '.github/workflows/xianfan-county-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xianfan-county-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-prototype:
    if: github.ref == 'refs/heads/xianfan/independent-living-county-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout only this independent branch
        uses: actions/checkout@v4
      - name: Prepare JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run deterministic world tests
        run: node --test projects/xianfan-living-world/tests/world.test.mjs
      - name: Install stable PROTOTYPE signing key
        working-directory: projects/xianfan-living-world/android
        run: |
          base64 -d demo-signing/xianfan-demo.jks.b64 > demo-signing/xianfan-demo.jks
          keytool -list -keystore demo-signing/xianfan-demo.jks -storepass DEMO_ONLY_XIANFAN_2026 -alias xianfan-demo | head -5
      - name: Compile signed standalone APK
        working-directory: projects/xianfan-living-world/android
        run: gradle --no-daemon :app:assembleRelease
      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xianfan-dist
          cp projects/xianfan-living-world/android/app/build/outputs/apk/release/app-release.apk xianfan-dist/xianfan-county-0.5.1-demo.apk
          sha256sum xianfan-dist/*.apk | tee xianfan-dist/SHA256SUMS.txt
          unzip -l xianfan-dist/*.apk | grep -E 'index.html|core.js|spatial.js|atlas.js|app.js|style.css' > xianfan-dist/asset-proof.txt
          test "$(wc -l < xianfan-dist/asset-proof.txt)" -ge 5
      - name: Upload APK (GitHub Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xianfan-county-android-v0.5.1
          path: xianfan-dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish independent GitHub prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='xianfan-county-v0.5.1-demo'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" xianfan-dist/* --clobber
          else
            gh release create "$tag" xianfan-dist/* \
              --target "$GITHUB_SHA" --prerelease \
              --title '仙凡共生·临安县 v0.5.1（独立测试APK）' \
              --notes '本测试包不属于苍岚或WorldBox，不得覆盖原游戏。当前签名是公开测试密钥，仅供内部体验。离线运行；13,680居民档案+逐帧持续推进的行程与世界时间+点击建筑弹出位置详情和在场人员+建筑门口抵达后进入+地形河网城防图+跨地图语义缩放；已通过自动化规则测试，Android真机待验收；未通过手机实机验收。'
          fi
