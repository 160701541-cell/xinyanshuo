name: Canglan ORIGINAL APK176 rev186 - OnePlus 3 Quality, P0 Both-Side Taps, Real Soil and Animated NPCs Signed OTA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canglan-apk176-rev186-oneplus-mobile-P0-signed.yml'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_living_resource_world_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scenes/main_original_quality_rev186.tscn'
      - 'game-source/apk176-ota177-candidate/scenes/main_rev186.tscn.remap'
      - 'game-source/godot3d/scripts/worldbox_life_sim.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_ecology_succession_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_kenney_visual_palette_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_kenney_multimesh_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_strata_terrain_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_player_controller_rev186.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_quality_profiles_rev186.gd'
      - 'logic-qa/apk176-export-fixture/verify_original_main_quality_rev186.gd'
      - 'logic-qa/tools/build_apk176_quality_rev186.gd'
      - 'tools/verify_apk176_rev186_3d_pck.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: canglan-original-game-ota-rev186
  cancel-in-progress: true
jobs:
  rev186-real-gui-left-world-tap-original-apk176-publish:
    if: github.repository == '160701541-cell/xinyanshuo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore actual original APK176 exported resources without replacing fixtures with mocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results qa-stage/ota177/{scenes,scripts,hd2d/courtyard,hd2d/worldx}
          cp game-source/apk176-ota177-candidate/scenes/* qa-stage/ota177/scenes/
          cp game-source/apk176-ota177-candidate/scripts/* qa-stage/ota177/scripts/
          test -s game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png
          cp game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png qa-stage/ota177/hd2d/courtyard/main_house_isolated_edge04.png
          cp game-source/apk176-ota177-candidate/hd2d/courtyard/*.png qa-stage/ota177/hd2d/courtyard/
          cp -R game-source/apk176-ota177-candidate/hd2d/worldx/. qa-stage/ota177/hd2d/worldx/
          cp art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg qa-stage/ota177/hd2d/atlas_village_ota177.jpg
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          src=Path(json.loads(Path('android-preview/base-latest.json').read_text())['file'])
          root=Path('logic-qa/apk176-export-fixture')
          count=0
          total=0
          with ZipFile(src) as apk:
              for entry in apk.infolist():
                  if not entry.filename.startswith('assets/') or entry.is_dir():
                      continue
                  rel=Path(entry.filename[len('assets/'):])
                  if str(rel)=='project.godot':
                      continue  # Keep the deliberately minimal exported-runtime QA project config.
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('APK zip path traversal blocked')
                  if entry.file_size > 100_000_000:
                      raise SystemExit('Unexpected single APK asset > 100MB: '+str(rel))
                  dst=root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(apk.read(entry))
                  count+=1
                  total+=entry.file_size
          assert (root/'.godot/global_script_class_cache.cfg').is_file()
          assert (root/'shaders/atmosphere/layered_cloud_sky.gdshader').is_file()
          print('PASS_REAL_APK176_FULL_EXPORTED_ASSET_FIXTURE',count,'files',total,'bytes')
          descriptor=root/'addons/terrain_3d/terrain.gdextension'
          if descriptor.is_file():
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_START')
              print(descriptor.read_text(encoding='utf-8',errors='replace')[:11000])
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_END')
          else:
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_MISSING')
          with ZipFile(src) as apk:
              for n in apk.namelist():
                  if 'terrain' in n.lower() and (n.endswith('.so') or n.endswith('.gdextension') or n.endswith('.dll') or n.endswith('.dylib')):
                      print('APK176_NATIVE_TERRAIN_ENTRY',n)
          print('PASS_APK_NATIVE_TERRAIN_DIAGNOSTIC')
          PY
      - name: Recover exact-matching Terrain3D Linux QA plugin from trusted upstream releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          src=pathlib.Path(json.loads(pathlib.Path('android-preview/base-latest.json').read_text())['file'])
          with zipfile.ZipFile(src) as apk:
              name='lib/arm64-v8a/libterrain.android.debug.arm64.so'
              assert name in apk.namelist(), 'Actual APK176 Terrain3D Android native binary missing'
              raw=apk.read(name)
          pathlib.Path('/tmp/canglan-actual-android-terrain.so').write_bytes(raw)
          print('APK176_REAL_ANDROID_TERRAIN_SHA256',hashlib.sha256(raw).hexdigest(),'size',len(raw))
          PY
          for version in v1.0.1-stable v1.0.2-stable; do
            case "$version" in
              v1.0.1-stable) archive=Terrain3D_v1.0.1.zip ;;
              v1.0.2-stable) archive=Terrain3D_v1.0.2-stable.zip ;;
            esac
            if ! curl -fL --retry 2 --connect-timeout 15 --max-time 110 \
              "https://github.com/TokisanGames/Terrain3D/releases/download/$version/$archive" -o /tmp/upstream-terrain.zip; then
              echo "UPSTREAM_TERRAIN_DOWNLOAD_UNAVAILABLE $version"
              continue
            fi
            if CANGLAN_TERRAIN_VERSION="$version" python3 - <<'PY'
          import hashlib,os,zipfile,pathlib,sys
          expected=hashlib.sha256(pathlib.Path('/tmp/canglan-actual-android-terrain.so').read_bytes()).hexdigest()
          z=zipfile.ZipFile('/tmp/upstream-terrain.zip')
          names=z.namelist()
          android=[n for n in names if n.endswith('libterrain.android.debug.arm64.so')]
          linux=[n for n in names if n.endswith('libterrain.linux.debug.x86_64.so')]
          if not android or not linux:
              print('TERRAIN_RELEASE_MISSING_PLATFORM_BINARY',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          actual=hashlib.sha256(z.read(android[0])).hexdigest()
          print('UPSTREAM_TERRAIN_ANDROID_SHA256',os.environ['CANGLAN_TERRAIN_VERSION'],actual)
          if actual!=expected:
              print('NO_PROVEN_SAME_PLUGIN_VERSION',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          target=pathlib.Path('logic-qa/apk176-export-fixture/addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so')
          target.parent.mkdir(parents=True,exist_ok=True)
          data=z.read(linux[0])
          target.write_bytes(data)
          print('PASS_EXACT_APK176_NATIVE_TERRAIN_VERSION_MATCHED_AND_LINUX_QA_LIBRARY_STAGED',
                os.environ['CANGLAN_TERRAIN_VERSION'],'LinuxBytes',len(data))
          PY
            then
              echo "MATCHED_NATIVE_TERRAIN_VERSION=$version" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${MATCHED_NATIVE_TERRAIN_VERSION:-}" ] && ! grep -q '^MATCHED_NATIVE_TERRAIN_VERSION=' "$GITHUB_ENV"; then
            echo 'BLOCKED: neither upstream release Android binary exactly matches APK176; no substitute DLL was injected'
          fi
      - name: Install actual Godot 4.4.1 engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Build original APK176 living world with real material economy and seven licensed GLBs
        env:
          CANGLAN_OTA_STAGE_DIR: ${{ github.workspace }}/qa-stage/ota177
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-stage/ota177/canglan_rev186 qa-results
          cp game-source/godot3d/scripts/worldbox_life_sim.gd qa-stage/ota177/canglan_rev186/worldbox_life_sim.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_ecology_succession_rev186.gd qa-stage/ota177/canglan_rev186/ecology_growth.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_visual_palette_rev186.gd qa-stage/ota177/canglan_rev186/visual_palette.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_multimesh_rev186.gd qa-stage/ota177/canglan_rev186/kenney_multimesh.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_strata_terrain_rev186.gd qa-stage/ota177/canglan_rev186/strata_terrain.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_player_controller_rev186.gd qa-stage/ota177/canglan_rev186/player_controller.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_quality_profiles_rev186.gd qa-stage/ota177/canglan_rev186/quality_profiles.gd
          cp game-source/godot3d/assets/free_cc0/kenney/3d/nature/tree_oak.glb qa-stage/ota177/canglan_rev186/tree_oak.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/rocks-small.glb qa-stage/ota177/canglan_rev186/rocks_small.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/tree-log.glb qa-stage/ota177/canglan_rev186/tree_log.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/wall-narrow-wood-fence.glb qa-stage/ota177/canglan_rev186/wood_fence.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/stairs-stone.glb qa-stage/ota177/canglan_rev186/stone_steps.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/door.glb qa-stage/ota177/canglan_rev186/wood_door.glb
          cp game-source/godot3d/assets/free_cc0/quaternius_knight/public/models/knight.glb qa-stage/ota177/canglan_rev186/animated_knight.glb
          # The original Kenney Castle Kit rock GLB contains an EXTERNAL
          # res://Textures/colormap.png reference. Preserve its exact CC0 kit
          # palette; a GLB alone is not a complete colored asset.
          mkdir -p qa-stage/ota177/Textures
          curl -fL --retry 3 --connect-timeout 20 --max-time 70 \
            'https://raw.githubusercontent.com/shorepine/kenney/main/3d/castle/Textures/colormap.png' \
            -o qa-stage/ota177/Textures/colormap.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('qa-stage/ota177/Textures/colormap.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'The real Kenney source PNG is missing'
          assert len(b)>128 and 0<struct.unpack_from('>I',b,16)[0]<=4096
          print('PASS_LICENSED_KENNEY_CASTLE_COLORMAP_PRESENT',len(b))
          PY
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path logic-qa --import > qa-results/rev186-import.log 2>&1 || {
            tail -110 qa-results/rev186-import.log; exit 1;
          }
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa             --script res://tools/build_apk176_quality_rev186.gd > qa-results/rev186-build.log 2>&1 || {
            tail -110 qa-results/rev186-build.log; exit 1;
          }
          grep -Fq 'PASS_APK176_REV186_LIVING_3D_AUTONOMOUS_PCK_BUILT_UNSIGNED' qa-results/rev186-build.log || {
            tail -110 qa-results/rev186-build.log; exit 1;
          }
          python3 tools/verify_apk176_rev186_3d_pck.py qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck
      - name: QA actual APK176 Main runs animated workers, finite resources and material-paid staged 3D construction
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless             --path logic-qa/apk176-export-fixture             --script res://verify_original_main_quality_rev186.gd             > qa-results/rev186-original-main-3d.log 2>&1 || {
              tail -100 qa-results/rev186-original-main-3d.log; exit 1;
            }
          grep -Fq 'PASS_REV186_LICENSED_3D_NPC_RESOURCE_TRANSPORT_MATERIAL_CONSERVATION_STAGE_BUILD' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_PHONE_VISIBILITY_TREE_SEED_BEDROCK_EXCLUSION_AND_TECTONIC_MILLIONS_OF_YEARS' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_FIVE_SWATCHES_REAL_KENNEY_MULTIMESH_ONE_SUN_AND_CLEAR_ROADS' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_REAL_MOVABLE_PLAYER_FIRST_THIRD_PERSON_ZOOM_TOUCH_INTERACT_AND_EXCAVATE_STRATIFIED_COLLISION_WATER' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_ONEPLUS_MANUAL_EXTREME_HIGH_NORMAL_QUALITY_100_85_67_MSAA_SHADOW_GRASS_FX_FOG_HUD_AND_NATIVE_UI' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_ACTUAL_GUI_JOYSTICK_RIGHT_LOOK_NPC_MESH_FEET_CONTINUOUS_TERRAIN_NO_WORLD_SYSTEM_IDS' qa-results/rev186-original-main-3d.log
          grep -Fq 'PASS_REV186_LEFT_AND_RIGHT_WORLD_TOUCH_TO_ENTITY_INTERACTION_NO_JOYSTICK_CONFLICT' qa-results/rev186-original-main-3d.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_APK176|Failed loading resource' qa-results/rev186-original-main-3d.log; then
            cat qa-results/rev186-original-main-3d.log; exit 1
          fi
      - name: Regression original APK176 house enter-exit with new 3D content loaded
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa/apk176-export-fixture --script res://verify_original_main_live_house.gd > qa-results/rev186-original-house-regression.log 2>&1 || {
            tail -100 qa-results/rev186-original-house-regression.log; exit 1;
          }
          grep -Fq 'OBSERVED_APK176_MAIN_INSTANCE_WITH_PORTAL_AND_IMAGES_PENDING_ENGINE_ERROR_AUDIT' qa-results/rev186-original-house-regression.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_APK176|Failed loading resource' qa-results/rev186-original-house-regression.log; then
            tail -100 qa-results/rev186-original-house-regression.log; exit 1
          fi
      - name: Generate unsigned rev186 candidate bound to original APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 logic-qa/release-gate/sign_pck_release.py             --pack qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck             --revision 186 --minimum-android-code 1176 --maximum-android-code 1176             --pack-url 'https://160701541-cell.github.io/xinyanshuo/android-preview/canglan-content-rev-186.pck'             --notes '苍岚原APK176：修复左侧树林也能点实体和独立GUI摇杆；三档手动画质：极致100%/4x 1500draw/150万面、高85%/2x默认800draw/60万面、普通67%/无MSAA 400draw/30万面，NPC骨骼/系统级ID、平滑泥土地层与可挖水岸。手机三档性能需真机数据。'             --unsigned-template             --output qa-results/rev186-unsigned.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('qa-results/rev186-unsigned.json')
          d=json.loads(p.read_text())
          assert d['revision']==186
          d['_visual_goal']='ORIGINAL_3D_WORLD_PREVIEW'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Sign only actual same-APK176 Godot accepted rev186 candidate
        shell: bash
        env:
          CANGLAN_PCK_SIGNING_KEY_B64: ${{ secrets.CANGLAN_PCK_SIGNING_KEY_B64 }}
          CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_PRIVATE_KEY_PEM }}
          CANGLAN_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          python3 tools/stage_original_next_ota.py             --pck qa-results/canglan-apk176-rev186-3d-UNSIGNED.pck             --qa-template qa-results/rev186-unsigned.json             --qa-runtime-log qa-results/rev186-original-main-3d.log             --original-qa-success             --output qa-results/rev186-signed-stage
          python3 tools/ota_release_gate.py             --candidate qa-results/rev186-signed-stage/latest.json             --pck qa-results/rev186-signed-stage/canglan-content-rev-186.pck             --report qa-results/rev186-cryptographic-gate.json
      - name: Publish authentic rev186 signed original-game assets only after full QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-preview
          test "$(python3 -c "import json;print(json.load(open('android-preview/latest.json'))['revision'])")" = 185
          test ! -e android-preview/canglan-content-rev-186.pck
          cp qa-results/rev186-signed-stage/canglan-content-rev-186.pck android-preview/
          cp qa-results/rev186-signed-stage/latest.json android-preview/latest.json
          git config user.name 'canglan-original-apk176-ota-release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-preview/latest.json android-preview/canglan-content-rev-186.pck
          git commit -m 'release(official): APK176 RSA signed OnePlus 3 quality and left/right world touch rev186 [skip ci]'
          # main may advance while QA runs; rebase ONLY if production is still rev185.
          for attempt in 1 2 3; do
            git fetch origin main
            python3 - <<'PY'
          import json,subprocess,sys
          current=json.loads(subprocess.check_output(
              ['git','show','origin/main:android-preview/latest.json'],text=True))
          if current.get('revision') != 185:
              sys.exit('BLOCKED: remote OTA revision changed; never overwrite newer release')
          prior=subprocess.run(['git','cat-file','-e','origin/main:android-preview/canglan-content-rev-186.pck'],
                               stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if prior.returncode == 0:
              sys.exit('BLOCKED: rev186 already published; do not overwrite signed rev186 candidate')
          print('PASS_REMOTE_PRODUCTION_REV185_STILL_CURRENT')
          PY
            git rebase origin/main || {
              echo 'BLOCKED: cannot safely rebase signed release'; exit 1;
            }
            if git push origin HEAD:main; then
              echo 'PASS_REV186_SIGNED_OTA_PUBLISHED_TO_PUBLIC_MAIN'
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'BLOCKED: concurrent commits prevented safe publication'; exit 1
            fi
            sleep 3
          done
      - name: Preserve QA evidence, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-Original-APK176-AutonomousMaterials-rev186-QA-${{ github.sha }}
          path: |
            qa-results/rev186-*.log
            qa-results/rev186-*.json
            qa-results/rev186-signed-stage/staging-report.json
          if-no-files-found: warn
          retention-days: 14
