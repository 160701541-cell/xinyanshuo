name: Xianfan Android Debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - xianfan/independent-living-county-v0.1
    paths:
      - 'projects/xianfan-living-world/android-text/**'
      - '.github/workflows/xianfan-text-android.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Print Godot environment
        run: |
          godot --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah /root/.local/share/godot/export_templates || true
      - name: Restore Godot Android toolchain paths inside container
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.4.tres "$HOME/.config/godot/editor_settings-4.4.tres"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
      - name: Install Android 34 SDK tools required by Godot 4.4
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          ls -ld "$ANDROID_HOME/platforms/android-34" "$ANDROID_HOME/build-tools/34.0.0"
      - name: Validate GDScript and import project
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --editor --import --quit
      - name: Run gameplay regression checks
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_world.gd
      - name: Validate AI configuration and key privacy
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --script res://tests/test_ai.gd
      - name: Smoke-launch native UI
        run: |
          cd projects/xianfan-living-world/android-text
          godot --headless --path . --quit-after 30 > /tmp/xianfan-ui.log 2>&1
          cat /tmp/xianfan-ui.log
          if grep -E '(SCRIPT ERROR|Parse Error|Invalid call)' /tmp/xianfan-ui.log; then exit 1; fi
      - name: Export Android debug APK
        run: |
          cd projects/xianfan-living-world/android-text
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --path . --export-debug Android build/xianfan-canglan-debug.apk
          test -s build/xianfan-canglan-debug.apk
          sha256sum build/xianfan-canglan-debug.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xianfan-canglan-android-debug
          path: |
            projects/xianfan-living-world/android-text/build/xianfan-canglan-debug.apk
            projects/xianfan-living-world/android-text/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30