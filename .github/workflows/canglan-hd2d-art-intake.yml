name: Canglan HD2D Chinese Sprite Art Intake (Free Public)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canglan-hd2d-art-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download author-published CC0 Chinese characters (reference only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-art
          curl --fail --location --retry 2 --max-time 120 'https://opengameart.org/sites/default/files/Ancient%20Chinese%20Characters%20Pack%201.zip' -o qa-art/ancient-chinese-cc0-original.zip
          test "$(stat -c%s qa-art/ancient-chinese-cc0-original.zip)" -ge 1000000
          test "$(stat -c%s qa-art/ancient-chinese-cc0-original.zip)" -le 15000000
          sha256sum qa-art/ancient-chinese-cc0-original.zip | tee qa-art/source.sha256
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('qa-art/ancient-chinese-cc0-original.zip')
          with zipfile.ZipFile(p) as z:
              found=[]
              total=0
              for entry in z.infolist():
                  n=entry.filename.replace('\\', '/')
                  if n.startswith('/') or '..' in n.split('/'):
                      raise ValueError('unsafe ZIP paths')
                  total+=entry.file_size
                  if total>80000000:
                      raise ValueError('zip bomb')
                  found.append({'name': n, 'size': entry.file_size})
              assert len(found)>=8
              import struct
              for ent in z.infolist():
                  if ent.filename.endswith('.png') and '/Han/' in ent.filename and not ent.filename.startswith('__MACOSX/'):
                      png=z.read(ent)
                      dims=struct.unpack('>II',png[16:24]) if png[:8]==bytes.fromhex('89504e470d0a1a0a') else (0,0)
                      print('HAN_PNG',ent.filename,dims, 'PNG_BYTES',len(png))
          Path('qa-art/art-list.json').write_text(json.dumps(found, indent=2, ensure_ascii=False))
          print('PASS_CC0_CHINESE_ART_ARCHIVE_UNPACKED_AND_LISTED',len(found))
          print(json.dumps(found, ensure_ascii=False, indent=2)[:14000])
          PY
      - name: Publish two verified CC0 original PNG images for visual review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, zipfile
          from pathlib import Path
          archive=Path('qa-art/ancient-chinese-cc0-original.zip')
          out=Path('hd2d-assets/reference')
          out.mkdir(parents=True,exist_ok=True)
          mapping={
             'han_male.png':'Ancient Chinese Characters Pack 1/Han/Han Male Whole.png',
             'han_female.png':'Ancient Chinese Characters Pack 1/Han/Han Female Whole.png'
          }
          report={}
          with zipfile.ZipFile(archive) as z:
              for dest,source in mapping.items():
                  data=z.read(source)
                  assert data.startswith(bytes.fromhex('89504e470d0a1a0a'))
                  assert len(data)<500000
                  (out/dest).write_bytes(data)
                  (out/(dest+'.base64')).write_text(base64.b64encode(data).decode('ascii')+'\n')
                  report[dest]={'source':source, 'sha256':hashlib.sha256(data).hexdigest(), 'bytes':len(data)}
          (out/'SOURCE_CC0.json').write_text(json.dumps({
             'creator':'nessava','source_url':'https://opengameart.org/content/ancient-chinese-character-pack-1',
             'license':'CC0', 'intake_status':'reference art NOT HD-2D visual QA accepted',
             'assets':report}, indent=2)+'\n')
          print('PASS_CC0_AUTHENTIC_HAN_PNG_EXTRACTED',report)
          PY
          git config user.name "canglan-licensed-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hd2d-assets/reference/
          if ! git diff --cached --quiet; then
            git commit -m "art(reference): preserve original CC0 Han 2D figure PNGs and audit SHA"
            git push origin HEAD:main
          fi
      - name: Retain original source for an artist review; no auto-import into APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-Chinese-CC0-Figure-Originals-For-Art-Review
          path: qa-art/
          retention-days: 14
          if-no-files-found: warn
