name: Verify published Android release bytes
on:
  push:
    branches: [main]
    paths:
      - android-preview/base-latest.json
      - android-preview/latest.json
      - .github/workflows/verify-official-game-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Hash and parse published Android files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib, zipfile
          root=pathlib.Path('.')
          apk=json.loads((root/'android-preview/base-latest.json').read_text())
          pck=json.loads((root/'android-preview/latest.json').read_text())
          for path, expected in [
              (root/apk['file'],apk),
              (root/'android-preview'/f"canglan-content-rev-{pck['revision']}.pck",pck)]:
              assert path.is_file(),path
              assert path.stat().st_size==expected['size_bytes'],path
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected['sha256'],path
              print('VERIFIED_PUBLISHED_BYTES',path)
          with zipfile.ZipFile(root/apk['file']) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
          print('CURRENT_APK',apk['version_name'],'CURRENT_PCK',pck['revision'])
          print('THIS_CHECK_IS_NOT_A_NEW_GAME_UPDATE_OR_PHONE_TEST')
          PY
