name: ZhiYin True 3D Godot Model Material QA

on:
  push:
    branches: ['zhiyin/native-android-prototype']
    paths:
      - 'zhiyin-real3d/**'
      - '.github/workflows/zhiyin-real3d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhiyin-real3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-real3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: zhiyin-real3d
    steps:
      - uses: actions/checkout@v4
      - name: Install original PBR texture tooling
        run: python3 -m pip install --user 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Retrieve validated 3D glTF meshes and license manifest
        run: |
          set -euo pipefail
          python3 tools/import_cc0_models.py
          python3 - <<'PY'
          import json
          j=json.load(open('ASSET_MANIFEST.json'))
          assert len(j['models'])>=15
          assert all(a['meshes']>0 and a['materials']>0 for a in j['models'].values())
          print("VALID REAL 3D GLB mesh and embedded material manifest")
          PY
      - name: Create real albedo normal roughness maps
        run: |
          python3 tools/generate_materials.py
          for family in oak wall stone; do
            for layer in albedo normal roughness; do
              test -s "assets/materials/${family}_${layer}.png"
            done
          done
      - name: Install Godot Engine 4.4.1 (actual engine)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o /tmp/zhiyin-godot.zip
          echo "d6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa  /tmp/zhiyin-godot.zip" | sha256sum -c -
          unzip -q /tmp/zhiyin-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Install pinned MIT Godot VRM MToon importer
        run: |
          set -euo pipefail
          python3 tools/install_vrm_pipeline.py
          test -s addons/vrm/plugin.cfg
          test -s addons/Godot-MToon-Shader/plugin.cfg
      - name: Retrieve CC0 anime base for INTERNAL QA only
        run: |
          set -euo pipefail
          python3 tools/fetch_cc0_anime_base.py
          python3 tools/recolor_vrm_anime.py qa_samples/anime_cc0_lookdev.vrm qa_samples/blue_anime_lookdev.vrm
      - name: Import actual GLB, PNG and GDScript in Godot
        run: |
          set -euo pipefail
          timeout 180s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --import \
            >godot-import.log 2>&1 || { cat godot-import.log; exit 1; }
          cat godot-import.log | tail -40
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Failed to load script|ERROR:.*glb' godot-import.log; then
            cat godot-import.log; exit 1
          fi
      - name: Preserve temporary licensed anime base for internal texture QA
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-internal-vrm-lookdev-source
          path: zhiyin-real3d/qa_samples/anime_cc0_lookdev.vrm
          if-no-files-found: error
          retention-days: 1
      - name: Prove genuine VRM anime rig face morph and materials import
        run: |
          set -euo pipefail
          timeout 90s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/vrm_import_smoke.gd >vrm-import-qa.log 2>&1 || { cat vrm-import-qa.log; exit 1; }
          cat vrm-import-qa.log
          grep -Fq 'PASS REAL VRM ANIME MODEL IMPORT' vrm-import-qa.log
      - name: Inspect official Quaternius humanoid animation tracks
        run: |
          set -euo pipefail
          timeout 45s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path . --script res://tests/inspect_motion.gd | tee quaternius-motion-inspect.log
      - name: Spawn and QA scene inside the Godot engine
        run: |
          set -euo pipefail
          timeout 60s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . \
            --script res://tests/scene_smoke.gd >godot-scene-qa.log 2>&1 || {
              cat godot-scene-qa.log; exit 1;
            }
          cat godot-scene-qa.log
          grep -Fq 'PASS ZHIYIN TRUE 3D RENDER SCENE' godot-scene-qa.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Invalid call|Failed to load script' godot-scene-qa.log; then
            exit 1
          fi
      - name: Check room navigation and animation QA
        run: |
          set -euo pipefail
          timeout 50s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/navigation_smoke.gd >godot-navigation-qa.log 2>&1 || { cat godot-navigation-qa.log; exit 1; }
          grep -Fq 'PASS ZHIYIN FURNITURE PATH A-STAR' godot-navigation-qa.log
      - name: Render first REAL 3D screenshot via Mesa and Xvfb
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils fonts-noto-cjk >/dev/null
          LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path . \
            --rendering-method gl_compatibility --script res://tests/capture_frame.gd \
            >room-render.log 2>&1 || { cat room-render.log; exit 1; }
          cat room-render.log
          test -s room-qa-render.png
          grep -Fq 'PASS ACTUAL GODOT 3D FRAME' room-render.log
      - name: Render licensed anime VRM art baseline, not user character
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 100s xvfb-run -a -s "-screen 0 1280x720x24" /tmp/Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/capture_cc0_anime_base.gd >anime-base-render.log 2>&1 || { cat anime-base-render.log; exit 1; }
          cat anime-base-render.log
          grep -Fq 'PASS VRM CC0 ANIME BASE ACTUAL GODOT' anime-base-render.log
          test -s anime-base-front.png
          test -s anime-base-angle.png
          test -s anime-blue-front.png
          test -s anime-blue-angle.png
      - name: Exclude generic anime asset from shipped apk
        run: |
          python3 -c 'from pathlib import Path; Path("qa_samples/anime_cc0_lookdev.vrm").unlink(missing_ok=True)'
          python3 -c 'from pathlib import Path; Path("qa_samples/blue_anime_lookdev.vrm").unlink(missing_ok=True)'
      - name: Capture true 3D DeepSeek blue avatar close-up
        continue-on-error: true
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 70s xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility \
            --script res://tests/capture_deepseek_portrait.gd >deepseek-portrait.log 2>&1 || {
              cat deepseek-portrait.log; exit 1;
            }
          cat deepseek-portrait.log
          test -s deepseek-blue-avatar-engine-portrait.png
      - name: Package imported REAL 3D project files
        run: |
          set -euo pipefail
          zip -q -r /tmp/zhiyin-real3d-project.zip project.godot scenes assets addons VRM_PLUGIN_PROVENANCE.txt ASSET_MANIFEST.json tools tests characters
          test -s /tmp/zhiyin-real3d-project.zip
          cp /tmp/zhiyin-real3d-project.zip ./zhiyin-real3d-project.zip
      - name: Export real 3D scene as arm64 Android test APK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/zhiyin-templates.tpz
          echo "Official Godot export templates sha256:"
          sha256sum /tmp/zhiyin-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j -o /tmp/zhiyin-templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' \
            -d "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          echo "4.4.1.stable" > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          python3 -m pip install --quiet 'cryptography>=42,<47'
          python3 ../zhiyin-native/ci/make_lab_signer.py
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/zhiyin-test-signing.p12" \
            -srcstoretype PKCS12 -srcstorepass PublicLabOnly2026 \
            -srcalias zhiyin-lab -destalias zhiyin-lab \
            -destkeystore "$RUNNER_TEMP/zhiyin-lab.jks" \
            -deststoretype JKS -deststorepass android -destkeypass android
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$RUNNER_TEMP/zhiyin-lab.jks"
          export/android/debug_keystore_user = "zhiyin-lab"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "SDK: $ANDROID_HOME  JAVA: $JAVA_HOME_17_X64"
          java -version
          ls "$ANDROID_HOME/platform-tools/adb" "$JAVA_HOME_17_X64/bin/java"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/zhiyin-lab.jks"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="zhiyin-lab"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --verbose --path . --export-debug Android build/zhiyin-real3d-room-lab.apk \
            >godot-android-export.log 2>&1 || { cat godot-android-export.log; exit 1; }
          test -s build/zhiyin-real3d-room-lab.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
             build/zhiyin-real3d-room-lab.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
             build/zhiyin-real3d-room-lab.apk | grep -E 'package: name=|launchable-activity'
          sha256sum build/zhiyin-real3d-room-lab.apk
          cat godot-android-export.log | tail -60
      - name: Upload installable Godot real-3D Android LAB APK
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-real3d-android-lab-apk
          path: zhiyin-real3d/build/zhiyin-real3d-room-lab.apk
          if-no-files-found: error
      - name: Upload portable Godot project with actual GLB and PBR texture files
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-real3d-project-assets
          path: zhiyin-real3d/zhiyin-real3d-project.zip
          if-no-files-found: error
      - name: Upload genuine model/material manifest and engine QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-real3d-model-material-qa
          path: |
            zhiyin-real3d/ASSET_MANIFEST.json
            zhiyin-real3d/godot-import.log
            zhiyin-real3d/godot-scene-qa.log
            zhiyin-real3d/godot-navigation-qa.log
            zhiyin-real3d/vrm-import-qa.log
            zhiyin-real3d/anime-base-render.log
            zhiyin-real3d/anime-base-front.png
            zhiyin-real3d/anime-base-angle.png
            zhiyin-real3d/anime-blue-front.png
            zhiyin-real3d/anime-blue-angle.png
            zhiyin-real3d/VRM_PLUGIN_PROVENANCE.txt
            zhiyin-real3d/godot-android-export.log
            zhiyin-real3d/quaternius-motion-inspect.log
            zhiyin-real3d/room-render.log
            zhiyin-real3d/room-qa-render.png
            zhiyin-real3d/deepseek-portrait.log
            zhiyin-real3d/deepseek-blue-avatar-engine-portrait.png
          if-no-files-found: warn
