# P0: prove original installed APK176 OTA signature capability without leaking key data.
name: Canglan Original APK176 - Release RSA Signing Secret Readiness
on:
  push:
    branches: [main]
    paths:
      - 'tools/check_original_ota_secret.py'
      - '.github/workflows/canglan-original-ota-secret-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify permanent original APK176 signing key availability and match
        shell: bash
        env:
          CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_PCK_SIGNING_KEY_B64: ${{ secrets.CANGLAN_PCK_SIGNING_KEY_B64 }}
          CANGLAN_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_PRIVATE_KEY_PEM }}
          CANGLAN_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          python3 tools/check_original_ota_secret.py
      - name: Upload key capability result WITHOUT storing secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-apk176-rsa-signing-capability-${{ github.sha }}
          path: qa-results/original-apk176-signing-readiness.json
          if-no-files-found: warn
          retention-days: 7
