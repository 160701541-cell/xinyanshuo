name: Canglan - Real Gameplay Logic QA (Free Public Runner)

on:
  push:
    branches: [main]
    paths:
      - 'logic-qa/**'
      - '.github/workflows/canglan-logic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canglan-real-logic-qa-${{ github.ref }}
  # Continuous development must not cancel an already-running regression.
  # Keep one running plus the newest pending run; intermediate pushes coalesce.
  cancel-in-progress: false

jobs:
  audited-modules:
    name: Godot 4.4.1 two-thumb input, locomotion and identity QA (NOT full game)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout actual committed module
        uses: actions/checkout@v4
      - name: Download official Godot 4.4.1 for free Linux runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip' \
            --output /tmp/canglan-godot.zip
          unzip -q /tmp/canglan-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Run real GDScript regression in engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results
          GODOT=/tmp/Godot_v4.4.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path logic-qa --import \
            > qa-results/import.log 2>&1
          declare -A markers=(
            [entity_codes]='PASS CANG LAN ENTITY CODES REAL GODOT'
            [touch_look_router]='PASS combat touch router:'
            [character_locomotion]='PASS: humanoid rig relaxes arms'
            [two_thumb_input]='PASS CANG LAN SIMULTANEOUS TWO THUMB TOUCH'
          )
          for module in entity_codes touch_look_router character_locomotion two_thumb_input; do
            timeout 120s "$GODOT" --headless --path logic-qa \
              --script "res://tests/${module}_test.gd" \
              > "qa-results/${module}.log" 2>&1
            cat "qa-results/${module}.log"
            grep -Fq "${markers[$module]}" "qa-results/${module}.log"
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Assertion failed|Failed to load script' "qa-results/${module}.log"; then
              echo "BLOCKED: Godot reported errors in $module"
              exit 1
            fi
          done
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Assertion failed|Failed to load script' qa-results/import.log; then
            echo 'BLOCKED: Godot resource import failed'
            exit 1
          fi
          echo 'PASS: 4 real Godot test suites (identity, right-look, skeletal walking, simultaneous two-thumb control), NOT full game QA'
      - name: Build and independently mount unsigned test-only Godot PCK
        shell: bash
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/unsigned-touch-router-QA-ONLY.pck
        run: |
          set -euo pipefail
          mkdir -p qa-results
          GODOT=/tmp/Godot_v4.4.1-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path logic-qa \
            --script res://tools/build_touch_overlay.gd \
            > qa-results/test-pack-build.log 2>&1
          cat qa-results/test-pack-build.log
          grep -Fq 'PASS CANG LAN TEST PACK GENERATED' qa-results/test-pack-build.log
          test -s "$CANGLAN_QA_PCK_PATH"
          # A clean project has no loose router script. If the virtual pack mount
          # fails, stop CI; never infer Android/OTA release compatibility.
          timeout 90s "$GODOT" --headless --path logic-qa/pack-mount \
            --script res://verify_overlay.gd \
            > qa-results/test-pack-mount.log 2>&1
          cat qa-results/test-pack-mount.log
          grep -Fq 'PASS CANG LAN TEST PCK OVERRIDES STALE BASE SCRIPT' qa-results/test-pack-mount.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Assertion failed|Failed to load script' qa-results/test-pack-build.log qa-results/test-pack-mount.log; then
            echo 'BLOCKED: packed GDScript did not execute cleanly'
            exit 1
          fi
          sha256sum "$CANGLAN_QA_PCK_PATH" > qa-results/unsigned-test-pck.sha256
          echo 'PASS TEST-ONLY PCK. Signing, native APK and player save verification remain blocked.'

      - name: Save evidence even when QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canglan-entity-codes-qa-${{ github.sha }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
