name: Canglan Public HD2D - Godot Engine Scene QA
on:
  push:
    branches: [main]
    paths:
      - 'game-source/hd2d-world/**'
      - '.github/workflows/canglan-hd2d-godot-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canglan-hd2d-godot-scene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-hd2d-scene:
    name: Real Godot 4.4.1 procedural scene, doors, state, interior QA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce OSS runtime licences and reject unverifiable asset imports
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_open_source_registry.py --root .
          python3 -m unittest discover -s tools -p 'test_open_source_registry.py' -v
          test -s game-source/hd2d-world/opensource/THIRD_PARTY_NOTICES.md
          grep -Fq 'Godot Engine 4.4.1' game-source/hd2d-world/opensource/THIRD_PARTY_NOTICES.md
          grep -Fq 'FastNoiseLite' game-source/hd2d-world/opensource/THIRD_PARTY_NOTICES.md

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Import and statically parse complete PUBLIC HD2D project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-logs
          timeout 90s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor \
            --path game-source/hd2d-world --import > qa-logs/godot-import.log 2>&1 || {
            cat qa-logs/godot-import.log; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Failed to load script' qa-logs/godot-import.log; then
            cat qa-logs/godot-import.log; exit 1;
          fi
      - name: Run real in-engine scene startup smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path game-source/hd2d-world --script res://tests/scene_smoke.gd \
            > qa-logs/scene-smoke.log 2>&1 || { cat qa-logs/scene-smoke.log; exit 1; }
          cat qa-logs/scene-smoke.log
          grep -Fq 'PASS PUBLIC HD2D GODOT SCENE STARTUP' qa-logs/scene-smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|Assertion failed|Failed to load script' qa-logs/scene-smoke.log; then
            exit 1
          fi
      - name: Ensure new scene is programmatic and offline
        shell: bash
        run: |
          set -euo pipefail
          test -f game-source/hd2d-world/scripts/procedural_building.gd
          test -f game-source/hd2d-world/scripts/procedural_city.gd
          test -f game-source/hd2d-world/scripts/procedural_interior.gd
          test -f game-source/hd2d-world/scripts/procedural_prop.gd
          if grep -Eq 'HTTPRequest\\.new|ATLAS_URL|load_jpg_from_buffer' game-source/hd2d-world/scripts/village.gd; then
            echo 'BLOCKED: procedural scene must not depend on remote atlases'
            exit 2
          fi
          echo 'PASS offline procedural scene source contract'
      - name: Preserve exact QA evidence (not APK proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd2d-scene-QA-${{ github.sha }}
          path: qa-logs/
          retention-days: 7
          if-no-files-found: warn
