name: Canglan REV208 real CC0 pine cypress forest undergrowth Godot441 quarantine intake
on:
  push:
    branches: [feat/rev208-green-kenney-saplings-vegetation]
    paths:
      - '.github/workflows/canglan-rev208-hq-real-evergreen-understory-intake.yml'
      - 'tools/asset_factory/rev208_intake_cc0_evergreen_understory.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rev208-hq-evergreen-intake
  cancel-in-progress: false
jobs:
  import-real-cc0-vegetation:
    if: github.repository == '160701541-cell/xinyanshuo'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ASSET_DIR: game-source/apk176-ota177-candidate/assets/hq-rev208/vegetation/botanical
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate source intake Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/asset_factory/rev208_intake_cc0_evergreen_understory.py
      - name: Download eight exact individual CC0 pages and ACTUAL 3D GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/asset_factory/rev208_intake_cc0_evergreen_understory.py "$ASSET_DIR"
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          d=Path(os.environ['ASSET_DIR']); m=json.loads((d/'manifest.json').read_text())
          assert m['release_policy']=='QUARANTINED_NO_SIGNING_NO_OTA'
          assert set(m['items'])=={'pine','cypress','conifer','fern','hydrangea','rose','lavender','grass'}
          for k,a in m['items'].items():
            b=(d/a['file']).read_bytes()
            assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
            assert hashlib.sha256(b).hexdigest()==a['original_sha256']
            assert a['triangle_lod0']>100 and a['game_asset_approved'] is False
            assert a['license'].startswith('CC0')
          print('PASS_REV208_REAL_8_VENDOR_CC0_SOURCE_BINARIES_QUARANTINED_FOR_GODOT')
          PY
      - name: Acquire exactly Godot 4.4.1 original Android engine version
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -o /tmp/godot-hq-botanical.zip
          unzip -q /tmp/godot-hq-botanical.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: REAL Godot glTF import, asset size, geometry and material checks
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ASSET_DIR/project.godot" <<'EOP'
          config_version=5
          [application]
          config/name="CanGLan REV208 botanical licensed source QA only"
          EOP
          cat > "$ASSET_DIR/verify_godot_rev208_botanical.gd" <<'EOG'
          extends SceneTree
          func _initialize() -> void:
            call_deferred("_run")
          func _run() -> void:
            var species: Dictionary={
              "pine":Vector2(15.0,21.0),
              "cypress":Vector2(10.0,14.0),
              "conifer":Vector2(14.0,18.0),
              "fern":Vector2(0.10,1.5),
              "hydrangea":Vector2(0.6,1.7),
              "rose":Vector2(0.5,1.5),
              "lavender":Vector2(0.3,1.2),
              "grass":Vector2(0.6,1.6)
            }
            for kind in species:
              var source_path: String="res://hq_"+kind+"_cc0_lod0.glb"
              var bytes: PackedByteArray=FileAccess.get_file_as_bytes(source_path)
              var doc:=GLTFDocument.new()
              var state:=GLTFState.new()
              if doc.append_from_buffer(bytes,"res://",state)!=OK:
                printerr("FAIL_REV208_BOTANICAL_SOURCE_GLTF_"+kind)
                quit(21)
                return
              var model: Node3D=doc.generate_scene(state)
              if model==null:
                printerr("FAIL_REV208_BOTANICAL_NOT_REAL_MESH_"+kind)
                quit(22)
                return
              get_root().add_child(model)
              var meshes: Array[Node]=model.find_children("*","MeshInstance3D",true,false)
              if model is MeshInstance3D:
                meshes.append(model)
              var low: float=INF
              var high: float=-INF
              var triangle_count: int=0
              var material_count: int=0
              for mesh_node in meshes:
                var mesh: MeshInstance3D=mesh_node as MeshInstance3D
                if mesh.mesh==null:
                  continue
                for surface in range(mesh.mesh.get_surface_count()):
                  var arrays: Array=mesh.mesh.surface_get_arrays(surface)
                  var indices: PackedInt32Array=arrays[Mesh.ARRAY_INDEX]
                  var vertices: PackedVector3Array=arrays[Mesh.ARRAY_VERTEX]
                  triangle_count+=indices.size()/3 if not indices.is_empty() else vertices.size()/3
                  if mesh.mesh.surface_get_material(surface)!=null:
                    material_count+=1
                var box: AABB=mesh.get_aabb()
                for k in range(8):
                  var point: Vector3=mesh.to_global(box.get_endpoint(k))
                  low=minf(low,point.y)
                  high=maxf(high,point.y)
              var height: float=high-low
              var valid_range: Vector2=species[kind]
              if triangle_count<100 or material_count<1 or height<valid_range.x or height>valid_range.y:
                printerr("FAIL_REV208_BOTANICAL_GODOT_REAL_METER_SIZE_"+kind+
                  " height="+str(height)+" triangles="+str(triangle_count)+
                  " materials="+str(material_count))
                quit(23)
                return
              print("PASS_REV208_REAL_GODOT_441_VENDOR_GLTF_"+kind+
                "_height="+str(height)+"_triangles="+str(triangle_count)+
                "_materials="+str(material_count))
              model.queue_free()
              await process_frame
            print("PASS_REV208_EIGHT_REAL_BOTANICAL_GLBS_GODOT_441_IMPORTED_NO_PHONE_CLAIM")
            quit(0)
          EOG
          timeout 165s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path "$ASSET_DIR" \
            --script res://verify_godot_rev208_botanical.gd | tee "$ASSET_DIR/godot_botanical_qa.log"
          grep -Fq PASS_REV208_EIGHT_REAL_BOTANICAL_GLBS_GODOT_441_IMPORTED_NO_PHONE_CLAIM "$ASSET_DIR/godot_botanical_qa.log"
          rm -f "$ASSET_DIR/project.godot" "$ASSET_DIR/verify_godot_rev208_botanical.gd" "$ASSET_DIR/godot_botanical_qa.log"
      - name: Commit ONLY SHA verified original 3D and provenance to rev208 Draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "canglan-rev208-botanical-asset-intake"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ASSET_DIR"
          if git diff --cached --quiet; then
            echo "Same source GLBs: no artifact changes"
            exit 0
          fi
          git commit -m "assets(rev208): eight real CC0 pine cypress shrub fern grass GLBs, quarantine and SHA source"
          git pull --rebase origin feat/rev208-green-kenney-saplings-vegetation
          git push origin HEAD:feat/rev208-green-kenney-saplings-vegetation
      - name: Keep source and Godot evidence as CI artifact (NOT mobile!)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-REV208-CC0-EVERGREEN-BOTANICAL-GODOT441-SOURCE-${{ github.run_id }}
          path: ${{ env.ASSET_DIR }}/
          retention-days: 30
          if-no-files-found: warn
