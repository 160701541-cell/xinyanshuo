name: "WorldBox isolated v35 economy and bulk pixel material factory"
on:
  push:
    branches: ['worldbox/external-mod-lab-v22-zh-localization']
    paths:
      - 'tools/worldbox-xianxia/economy-v35/**'
      - 'tools/worldbox-xianxia/tests/EconomyScenarioV35.*'
      - '.github/workflows/worldbox-economy-asset-factory-v35.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materials-icons-pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Validate real 32px transparent sprite atlas and every recipe
        run: python tools/worldbox-xianxia/economy-v35/test_factory_v35.py
      - name: Build reproducible v35 materials and item icons asset pack
        run: |
          mkdir -p /tmp/worldbox-economy-v35
          python tools/worldbox-xianxia/economy-v35/material_factory_v35.py \
            --out /tmp/worldbox-economy-v35/materials \
            --zip /tmp/worldbox-economy-v35/WorldBox_v035_resources_icon_atlas_OWN_ART.zip
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('/tmp/worldbox-economy-v35/materials')
          x=json.loads((root/'resource_manifest.json').read_text(encoding='utf8'))
          assert len(x['items'])>=160 and len(x['recipes'])>=70
          assert all(p['target_tab'] in {'nature','creation','noosphere'} for p in x['items'])
          z=Path('/tmp/worldbox-economy-v35/WorldBox_v035_resources_icon_atlas_OWN_ART.zip')
          with zipfile.ZipFile(z) as f:
            assert f.testzip() is None
            assert not any(name.endswith(('.apk','.dex','.dll','.pck')) for name in f.namelist())
          print('PASS_BATCH_MATERIALS',len(x['items']),len(x['recipes']))
          PY
      - name: Upload generated original icons and recipe graph, NOT commercial game assets
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-v35-self-generated-pixel-materials-recipes
          path: /tmp/worldbox-economy-v35/WorldBox_v035_resources_icon_atlas_OWN_ART.zip
          if-no-files-found: error
          retention-days: 30
  economy-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Verify six-tier administrative & monetary/commodity conservation economy
        run: dotnet run --project tools/worldbox-xianxia/tests/EconomyScenarioV35.csproj -c Release
      - name: Build Android-ready standalone netstandard economy DLL
        run: |
          dotnet build tools/worldbox-xianxia/economy-v35/WorldBoxXianxiaEconomy.csproj -c Release --verbosity quiet
          mkdir -p /tmp/economy-v35
          cp tools/worldbox-xianxia/economy-v35/bin/Release/netstandard2.1/WorldBoxXianxiaEconomy.dll /tmp/economy-v35/
          test -s /tmp/economy-v35/WorldBoxXianxiaEconomy.dll
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-v35-economy-kernel-own-code-no-game-binaries
          path: /tmp/economy-v35/
          if-no-files-found: error
          retention-days: 30
