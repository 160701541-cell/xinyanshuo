name: Canglan APK176 rev186 - Real Site RSA PCK HTTP Proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canglan-rev186-real-pages-http-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-real-rev186-apk176-site:
    if: github.repository == '160701541-cell/xinyanshuo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify real public Pages latest.json against original APK176 RSA and complete rev186 PCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c "import json;print(json.load(open('android-preview/latest.json'))['revision'])")" = 186
          python3 tools/verify_original_current_ota_http.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('qa-results/original-current-public-ota-http.json').read_text())
          assert state['live_revision']==186, 'CDN is still a different revision'
          assert state['installed_apk_version_code']==1176
          assert state['pck_bytes']>21000000
          assert state['status']=='PASS_CURRENT_ORIGINAL_APK176_PUBLIC_HTTPS_RSA_SHA256_AND_RANGE'
          print('PASS_APK176_REAL_REV186_PUBLIC_PAGES_RSA_SHA256_HTTP_RANGE_PHONE_DOWNLOAD_READY')
          print('Actual finger controls, first-person framing, full resolution, ground digging and FPS are NOT accepted until user real Android screenshots')
          PY
      - name: Save HTTPS proof result without any keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-rev186-real-Pages-HTTP-download-proof
          path: qa-results/original-current-public-ota-http.json
          if-no-files-found: warn
          retention-days: 14
