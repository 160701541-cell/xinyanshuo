name: Official Site — Public Logs, Poster and Release Integrity

on:
  push:
    branches: [main]
    paths:
      - index.html
      - site.js
      - style.css
      - art/**
      - data/**
      - android-preview/latest.json
      - .github/workflows/site-content-qa.yml
  pull_request:
    paths:
      - index.html
      - site.js
      - style.css
      - art/**
      - .github/workflows/site-content-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript parse test
        run: node --check site.js
      - name: Cinematic visuals, mobile-ready community links and signed changelog checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):super().__init__();self.ids=set();self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.add(a['id'])
                  if tag=='img':self.images.append(a)
          page=Page()
          page.feed(Path('index.html').read_text(encoding='utf8'))
          for anchor in ('concept','devlog','development-list','development-sync',
                         'changelog','release-history','release-sync','download',
                         'apk-download-link','updates'):
              assert anchor in page.ids,anchor
          # New REAL cinematic AI concept art assets, shipped in this site,
          # not CSS-only vector mountain doodles. Exclude artifacts masquerading
          # as "gameplay" and verify all 4 image data objects are WebP.
          visuals=['art/canglan-vision-hero.webp',
                   'art/canglan-towns-life.webp',
                   'art/canglan-six-kingdoms.webp',
                   'art/canglan-robed-wanderer.webp']
          for f in visuals:
              p=Path(f)
              raw=p.read_bytes()
              assert p.stat().st_size>30000,('Incomplete cinematic hero image',f)
              assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',('Corrupt image',f)
              assert int.from_bytes(raw[4:8],'little')==len(raw)-8
              assert any(v.get('src')=='./'+f and v.get('alt') for v in page.images),f
          html=Path('index.html').read_text(encoding='utf8')
          assert html.count('概念')>=6
          assert '不是游戏实机截图' in html or '不是当前 APK 的画面截图' in html
          assert '1125050836' in html and '160701541' in html and 'xys160701541' in html
          assert 'https://qun.qq.com/universal-share/share?' in html
          assert 'https://wpa.qq.com/msgrd?' in html
          assert 'https://www.douyin.com/search/xys160701541?type=user' in html
          assert 'id="copy-qq"' in html and 'id="community"' in html
          assert '#world' in html and '#concept' in html
          print('PASS 4 IMMERSIVE REAL WEBP CONCEPT IMAGES, responsive community contacts, honest non-gameplay labels')

          a=json.loads(Path('data/development.json').read_text(encoding='utf8'))
          b=json.loads(Path('data/updates.json').read_text(encoding='utf8'))
          latest=json.loads(Path('android-preview/latest.json').read_text(encoding='utf8'))
          assert a['schema']==1 and a['channel']=='public-development-log'
          assert len(a['entries'])>5 and all(x['title'] and x['body'] for x in a['entries'])
          assert b['schema']==1 and b['channel']=='signed-releases'
          assert len(b['entries'])>0
          assert latest['channel']=='android-preview' and len(latest['signature'])>=128
          assert b['entries'][0]['revision']==latest['revision']
          assert b['entries'][0]['sha256']==latest['sha256']
          for row in b['entries']:
              assert re.fullmatch('[0-9a-f]{64}',row['sha256'])
              assert row['status']=='signed_release'
          for forbidden in ['-----BEGIN PRIVATE KEY-----','github_pat_','ghp_']:
              assert forbidden not in json.dumps(a),f'PRIVATE_LOG_LEAK: {forbidden}'
          print('PASS REAL OFFICIAL DEVLOG',len(a['entries']))
          print('PASS SIGNED GAME RELEASE HISTORY',len(b['entries']),'latest',latest['revision'])
          print('PASS CINEMATIC CONCEPT POSTERS NEVER MISLABELLED AS GAMEPLAY')
          PY
