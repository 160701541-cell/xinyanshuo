name: WorldBox xianxia sprite adapter QA (isolated)
on:
  push:
    branches:
      - worldbox/xianxia-asset-adapter-v04
    paths:
      - "tools/worldbox-xianxia/**"
      - ".github/workflows/worldbox-xianxia-sprite-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only Pillow for offline raster conversion
        run: python -m pip install "pillow>=10,<12"
      - name: Syntax gate
        run: python -m py_compile tools/worldbox-xianxia/export_nml_sprites.py tools/worldbox-xianxia/test_export_nml_sprites.py
      - name: Render-independent alpha, NML, SHA QA
        run: python tools/worldbox-xianxia/test_export_nml_sprites.py
      - name: Safety gate (do not publish WorldBox assets as Canglan OTA)
        run: |
          test ! -f tools/worldbox-xianxia/android-preview/latest.json
          test ! -f tools/worldbox-xianxia/worldbox.apk
