name: Canglan WorldX Courtyard Single Image
on:
  workflow_dispatch:
    inputs:
      image_model:
        description: '文生图模型（已默认选好 Kolors，直接运行即可）'
        required: false
        default: 'Kwai-Kolors/Kolors'
        type: string
permissions:
  contents: read
concurrency:
  group: canglan-worldx-courtyard-single
  cancel-in-progress: false
jobs:
  generate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_IMAGE_MODEL: ${{ inputs.image_model }}
      IMAGE_GEN_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      STEP1_MAX_RETRIES: "0"
      STEP1_GENERATE_TIMEOUT_MS: "150000"
      STEP1_REVIEW_TIMEOUT_MS: "45000"
    steps:
      - uses: actions/checkout@v4
      - name: Check image provider credentials
        run: |
          if [ -z "$SILICONFLOW_API_KEY" ]; then
            echo "::error::SILICONFLOW_API_KEY repository secret is not configured. No image was generated."
            exit 1
          fi
      - name: Validate selected image model
        run: |
          if [ -z "$SILICONFLOW_IMAGE_MODEL" ]; then
            echo '::error::Please provide image_model from the current SiliconFlow text-to-image model list.'
            exit 1
          fi
          if [ "$SILICONFLOW_IMAGE_MODEL" = 'black-forest-labs/FLUX.1-schnell' ]; then
            echo '::error::FLUX.1-schnell was discontinued on SiliconFlow; choose an active model.'
            exit 1
          fi
      - name: Checkout WorldX generator
        uses: actions/checkout@v4
        with:
          repository: YGYOOO/WorldX
          path: worldx-upstream
      - name: Patch WorldX native map generator prompt
        run: python3 tools/asset_factory/patch_worldx_canglan_courtyard.py --worldx-root worldx-upstream
      - name: Install WorldX generator dependencies
        working-directory: worldx-upstream/generators
        run: npm ci --ignore-scripts
      - name: Generate one courtyard with WorldX prompt and SiliconFlow image API
        working-directory: worldx-upstream/generators
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          mkdir -p ../../courtyard-output
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { loadPrompt } from './map/src/utils/prompt-loader.mjs';
          const model = (process.env.SILICONFLOW_IMAGE_MODEL || '').trim();
          if (!model) throw Error('Missing image_model input: choose an active text-to-image model from SiliconFlow model marketplace');
          const prompt = loadPrompt('step1-map-generation.md', {
            userPrompt: '苍岚高清国风四合院，单张独立建筑素材试样',
            additionalConstraints: '画风必须统一，不要像素风、Q版、90度俯视。',
          });
          const response = await fetch('https://api.siliconflow.cn/v1/images/generations', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.SILICONFLOW_API_KEY, 'Content-Type':'application/json'},
            body: JSON.stringify({model, prompt, image_size:'1024x1024'}),
            signal: AbortSignal.timeout(150000)
          });
          const raw = await response.text();
          if (!response.ok) throw Error('SiliconFlow image request failed HTTP '+response.status+': '+raw.slice(0,450));
          const json = JSON.parse(raw);
          const url = json.images?.[0]?.url;
          if (!url || !url.startsWith('https://')) throw Error('SiliconFlow did not return an image URL: '+raw.slice(0,450));
          const imgResponse = await fetch(url, {signal:AbortSignal.timeout(90000)});
          if (!imgResponse.ok) throw Error('Generated image download failed HTTP '+imgResponse.status);
          const bytes = Buffer.from(await imgResponse.arrayBuffer());
          if (bytes.length < 20000) throw Error('Image unexpectedly small');
          const png = bytes.subarray(0,8).toString('hex') === '89504e470d0a1a0a';
          const jpeg = bytes.subarray(0,3).toString('hex') === 'ffd8ff';
          if (!png && !jpeg) throw Error('Unknown image format');
          writeFileSync('../../courtyard-output/courtyard_source.'+(png?'png':'jpg'), bytes);
          writeFileSync('../../courtyard-output/generation_meta.json', JSON.stringify({
            generator:'WorldX native prompt-loader + SiliconFlow images/generations adapter',
            model, status:'generated_not_qa_approved', bytes:bytes.length,
            format:png?'png':'jpeg', prompt_version:'canglan-courtyard-batch01'
          },null,2));
          console.log('WORLDX_SILICONFLOW_COURTYARD_GENERATED',bytes.length);
          NODE
      - name: Upload generated source only
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-WorldX-Courtyard-Batch01-Unreviewed
          path: courtyard-output/
          if-no-files-found: error
          retention-days: 14
