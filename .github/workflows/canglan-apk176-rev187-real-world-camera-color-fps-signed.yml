name: Canglan ORIGINAL APK176 rev187 - Rich Kenney Terrain Sky Grass Fly God Camera FPS Caps and Original PCK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canglan-apk176-rev187-real-world-camera-color-fps-signed.yml'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_living_resource_world_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scenes/main_original_quality_rev187.tscn'
      - 'game-source/apk176-ota177-candidate/scenes/main_rev187.tscn.remap'
      - 'game-source/godot3d/scripts/worldbox_life_sim.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_ecology_succession_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_kenney_visual_palette_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_kenney_multimesh_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_strata_terrain_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_player_controller_rev187.gd'
      - 'game-source/apk176-ota177-candidate/scripts/apk176_quality_profiles_rev187.gd'
      - 'logic-qa/apk176-export-fixture/verify_original_main_quality_rev187.gd'
      - 'logic-qa/apk176-export-fixture/capture_original_main_rev187_compare.gd'
      - 'logic-qa/tools/build_apk176_quality_rev187.gd'
      - 'tools/verify_apk176_rev187_3d_pck.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: canglan-original-game-ota-rev187
  cancel-in-progress: true
jobs:
  rev187-real-visual-p0-original-apk176-publish:
    if: github.repository == '160701541-cell/xinyanshuo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore actual original APK176 exported resources without replacing fixtures with mocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results qa-stage/ota177/{scenes,scripts,hd2d/courtyard,hd2d/worldx}
          cp game-source/apk176-ota177-candidate/scenes/* qa-stage/ota177/scenes/
          cp game-source/apk176-ota177-candidate/scripts/* qa-stage/ota177/scripts/
          test -s game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png
          cp game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png qa-stage/ota177/hd2d/courtyard/main_house_isolated_edge04.png
          cp game-source/apk176-ota177-candidate/hd2d/courtyard/*.png qa-stage/ota177/hd2d/courtyard/
          cp -R game-source/apk176-ota177-candidate/hd2d/worldx/. qa-stage/ota177/hd2d/worldx/
          cp art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg qa-stage/ota177/hd2d/atlas_village_ota177.jpg
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          src=Path(json.loads(Path('android-preview/base-latest.json').read_text())['file'])
          root=Path('logic-qa/apk176-export-fixture')
          count=0
          total=0
          with ZipFile(src) as apk:
              for entry in apk.infolist():
                  if not entry.filename.startswith('assets/') or entry.is_dir():
                      continue
                  rel=Path(entry.filename[len('assets/'):])
                  if str(rel)=='project.godot':
                      continue  # Keep the deliberately minimal exported-runtime QA project config.
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('APK zip path traversal blocked')
                  if entry.file_size > 100_000_000:
                      raise SystemExit('Unexpected single APK asset > 100MB: '+str(rel))
                  dst=root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(apk.read(entry))
                  count+=1
                  total+=entry.file_size
          assert (root/'.godot/global_script_class_cache.cfg').is_file()
          assert (root/'shaders/atmosphere/layered_cloud_sky.gdshader').is_file()
          print('PASS_REAL_APK176_FULL_EXPORTED_ASSET_FIXTURE',count,'files',total,'bytes')
          descriptor=root/'addons/terrain_3d/terrain.gdextension'
          if descriptor.is_file():
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_START')
              print(descriptor.read_text(encoding='utf-8',errors='replace')[:11000])
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_END')
          else:
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_MISSING')
          with ZipFile(src) as apk:
              for n in apk.namelist():
                  if 'terrain' in n.lower() and (n.endswith('.so') or n.endswith('.gdextension') or n.endswith('.dll') or n.endswith('.dylib')):
                      print('APK176_NATIVE_TERRAIN_ENTRY',n)
          print('PASS_APK_NATIVE_TERRAIN_DIAGNOSTIC')
          PY
      - name: Recover exact-matching Terrain3D Linux QA plugin from trusted upstream releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          src=pathlib.Path(json.loads(pathlib.Path('android-preview/base-latest.json').read_text())['file'])
          with zipfile.ZipFile(src) as apk:
              name='lib/arm64-v8a/libterrain.android.debug.arm64.so'
              assert name in apk.namelist(), 'Actual APK176 Terrain3D Android native binary missing'
              raw=apk.read(name)
          pathlib.Path('/tmp/canglan-actual-android-terrain.so').write_bytes(raw)
          print('APK176_REAL_ANDROID_TERRAIN_SHA256',hashlib.sha256(raw).hexdigest(),'size',len(raw))
          PY
          for version in v1.0.1-stable v1.0.2-stable; do
            case "$version" in
              v1.0.1-stable) archive=Terrain3D_v1.0.1.zip ;;
              v1.0.2-stable) archive=Terrain3D_v1.0.2-stable.zip ;;
            esac
            if ! curl -fL --retry 2 --connect-timeout 15 --max-time 110 \
              "https://github.com/TokisanGames/Terrain3D/releases/download/$version/$archive" -o /tmp/upstream-terrain.zip; then
              echo "UPSTREAM_TERRAIN_DOWNLOAD_UNAVAILABLE $version"
              continue
            fi
            if CANGLAN_TERRAIN_VERSION="$version" python3 - <<'PY'
          import hashlib,os,zipfile,pathlib,sys
          expected=hashlib.sha256(pathlib.Path('/tmp/canglan-actual-android-terrain.so').read_bytes()).hexdigest()
          z=zipfile.ZipFile('/tmp/upstream-terrain.zip')
          names=z.namelist()
          android=[n for n in names if n.endswith('libterrain.android.debug.arm64.so')]
          linux=[n for n in names if n.endswith('libterrain.linux.debug.x86_64.so')]
          if not android or not linux:
              print('TERRAIN_RELEASE_MISSING_PLATFORM_BINARY',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          actual=hashlib.sha256(z.read(android[0])).hexdigest()
          print('UPSTREAM_TERRAIN_ANDROID_SHA256',os.environ['CANGLAN_TERRAIN_VERSION'],actual)
          if actual!=expected:
              print('NO_PROVEN_SAME_PLUGIN_VERSION',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          target=pathlib.Path('logic-qa/apk176-export-fixture/addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so')
          target.parent.mkdir(parents=True,exist_ok=True)
          data=z.read(linux[0])
          target.write_bytes(data)
          print('PASS_EXACT_APK176_NATIVE_TERRAIN_VERSION_MATCHED_AND_LINUX_QA_LIBRARY_STAGED',
                os.environ['CANGLAN_TERRAIN_VERSION'],'LinuxBytes',len(data))
          PY
            then
              echo "MATCHED_NATIVE_TERRAIN_VERSION=$version" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${MATCHED_NATIVE_TERRAIN_VERSION:-}" ] && ! grep -q '^MATCHED_NATIVE_TERRAIN_VERSION=' "$GITHUB_ENV"; then
            echo 'BLOCKED: neither upstream release Android binary exactly matches APK176; no substitute DLL was injected'
          fi
      - name: Install actual Godot 4.4.1 engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Build original APK176 living world with real material economy and seven licensed GLBs
        env:
          CANGLAN_OTA_STAGE_DIR: ${{ github.workspace }}/qa-stage/ota177
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-stage/ota177/canglan_rev187 qa-results
          cp game-source/godot3d/scripts/worldbox_life_sim.gd qa-stage/ota177/canglan_rev187/worldbox_life_sim.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_ecology_succession_rev187.gd qa-stage/ota177/canglan_rev187/ecology_growth.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_visual_palette_rev187.gd qa-stage/ota177/canglan_rev187/visual_palette.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_multimesh_rev187.gd qa-stage/ota177/canglan_rev187/kenney_multimesh.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_strata_terrain_rev187.gd qa-stage/ota177/canglan_rev187/strata_terrain.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_player_controller_rev187.gd qa-stage/ota177/canglan_rev187/player_controller.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_quality_profiles_rev187.gd qa-stage/ota177/canglan_rev187/quality_profiles.gd
          cp game-source/godot3d/assets/free_cc0/kenney/3d/nature/tree_oak.glb qa-stage/ota177/canglan_rev187/tree_oak.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/rocks-small.glb qa-stage/ota177/canglan_rev187/rocks_small.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/tree-log.glb qa-stage/ota177/canglan_rev187/tree_log.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/wall-narrow-wood-fence.glb qa-stage/ota177/canglan_rev187/wood_fence.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/stairs-stone.glb qa-stage/ota177/canglan_rev187/stone_steps.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/door.glb qa-stage/ota177/canglan_rev187/wood_door.glb
          cp game-source/godot3d/assets/free_cc0/quaternius_knight/public/models/knight.glb qa-stage/ota177/canglan_rev187/animated_knight.glb
          # The original Kenney Castle Kit rock GLB contains an EXTERNAL
          # res://Textures/colormap.png reference. Preserve its exact CC0 kit
          # palette; a GLB alone is not a complete colored asset.
          mkdir -p qa-stage/ota177/Textures
          curl -fL --retry 3 --connect-timeout 20 --max-time 70 \
            'https://raw.githubusercontent.com/shorepine/kenney/main/3d/castle/Textures/colormap.png' \
            -o qa-stage/ota177/Textures/colormap.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('qa-stage/ota177/Textures/colormap.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'The real Kenney source PNG is missing'
          assert len(b)>128 and 0<struct.unpack_from('>I',b,16)[0]<=4096
          print('PASS_LICENSED_KENNEY_CASTLE_COLORMAP_PRESENT',len(b))
          PY
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path logic-qa --import > qa-results/rev187-import.log 2>&1 || {
            tail -110 qa-results/rev187-import.log; exit 1;
          }
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa             --script res://tools/build_apk176_quality_rev187.gd > qa-results/rev187-build.log 2>&1 || {
            tail -110 qa-results/rev187-build.log; exit 1;
          }
          grep -Fq 'PASS_APK176_REV187_LIVING_3D_AUTONOMOUS_PCK_BUILT_UNSIGNED' qa-results/rev187-build.log || {
            tail -110 qa-results/rev187-build.log; exit 1;
          }
          python3 tools/verify_apk176_rev187_3d_pck.py qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
      - name: Parse-check ALL rev187 GDScript in a physical Godot project before testing APK PCK
        shell: bash
        run: |
          set -euo pipefail
          printf 'config_version=5\n' > qa-stage/ota177/project.godot
          for script in strata_terrain quality_profiles player_controller visual_palette kenney_multimesh ecology_growth; do
            echo "GODOT_GDSCRIPT_COMPILE_CHECK $script"
            if ! timeout 35s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
                --path qa-stage/ota177 --check-only --script "res://canglan_rev187/$script.gd" \
                > "qa-results/rev187-parse-$script.log" 2>&1; then
              cat "qa-results/rev187-parse-$script.log"
              exit 1
            fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' "qa-results/rev187-parse-$script.log"; then
              cat "qa-results/rev187-parse-$script.log"
              exit 1
            fi
          done
          echo PASS_REV187_ALL_ACTUAL_GODOT_SCRIPTS_PARSE_COMPILATION
      - name: QA actual APK176 Main runs animated workers, finite resources and material-paid staged 3D construction
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless             --path logic-qa/apk176-export-fixture             --script res://verify_original_main_quality_rev187.gd             > qa-results/rev187-original-main-3d.log 2>&1 || {
              tail -100 qa-results/rev187-original-main-3d.log; exit 1;
            }
          grep -Fq 'PASS_REV187_LICENSED_3D_NPC_RESOURCE_TRANSPORT_MATERIAL_CONSERVATION_STAGE_BUILD' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_PHONE_VISIBILITY_TREE_SEED_BEDROCK_EXCLUSION_AND_TECTONIC_MILLIONS_OF_YEARS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_UNLIMITED_NATURAL_MULTIHUE_KENNEY_MESH_BATCH_SINGLE_WARM_SUN' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_REAL_MOVABLE_PLAYER_FIRST_THIRD_PERSON_ZOOM_TOUCH_INTERACT_AND_EXCAVATE_STRATIFIED_COLLISION_WATER' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_ONEPLUS_MANUAL_EXTREME_HIGH_NORMAL_QUALITY_100_85_67_MSAA_SHADOW_GRASS_FX_FOG_HUD_AND_NATIVE_UI' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_ACTUAL_GUI_JOYSTICK_RIGHT_LOOK_NPC_MESH_FEET_CONTINUOUS_TERRAIN_NO_WORLD_SYSTEM_IDS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_LEFT_AND_RIGHT_WORLD_TOUCH_TO_ENTITY_INTERACTION_NO_JOYSTICK_CONFLICT' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_5_FPS_CAPS_3_GRAPHICS_FOLDING_PERF_NO_WARNING_OVERLAP_WARM_BLUE_SKY_CLOUDS_BLUISH_FOG_FAR_LAND_FIVE_LEAF_GRASS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV187_ANDROID_VERTICAL_DRAG_NOT_INVERTED_GOD_VIEW_AND_FREE_FLIGHT_RESET' qa-results/rev187-original-main-3d.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_APK176|Failed loading resource' qa-results/rev187-original-main-3d.log; then
            cat qa-results/rev187-original-main-3d.log; exit 1
          fi
      - name: Regression original APK176 house enter-exit with new 3D content loaded
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa/apk176-export-fixture --script res://verify_original_main_live_house.gd > qa-results/rev187-original-house-regression.log 2>&1 || {
            tail -100 qa-results/rev187-original-house-regression.log; exit 1;
          }
          grep -Fq 'OBSERVED_APK176_MAIN_INSTANCE_WITH_PORTAL_AND_IMAGES_PENDING_ENGINE_ERROR_AUDIT' qa-results/rev187-original-house-regression.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_APK176|Failed loading resource' qa-results/rev187-original-house-regression.log; then
            tail -100 qa-results/rev187-original-house-regression.log; exit 1
          fi
      - name: Capture original installed game ACTUAL Godot Vulkan frames at same worksite camera before publication
        shell: bash
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
          CANGLAN_SCREENSHOT_DIR: ${{ github.workspace }}/qa-results/rev187-real-worksite
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libvulkan1 mesa-vulkan-drivers fonts-noto-cjk
          mkdir -p qa-results/rev187-real-worksite
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -iname '*lvp*.json' | head -n 1)"
          if [ -n "$icd" ]; then export VK_DRIVER_FILES="$icd"; fi
          timeout 145s xvfb-run -a -s '-screen 0 1280x720x24' \
            /tmp/Godot_v4.4.1-stable_linux.x86_64 \
            --path logic-qa/apk176-export-fixture \
            --resolution 1280x720 \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --audio-driver Dummy \
            --script res://capture_original_main_rev187_compare.gd \
            > qa-results/rev187-real-worksite/render.log 2>&1 || {
              tail -125 qa-results/rev187-real-worksite/render.log; exit 1;
            }
          grep -Fq 'PASS_REV187_TWO_GENUINE_ENGINE_RENDERED_WORKSITE_FRAMES_NOT_PHONE_TESTS' qa-results/rev187-real-worksite/render.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:|FAIL_REV187|Failed loading resource' qa-results/rev187-real-worksite/render.log; then
            tail -100 qa-results/rev187-real-worksite/render.log; exit 1
          fi
          python3 - <<'PY'
          import pathlib,struct
          d=pathlib.Path("qa-results/rev187-real-worksite")
          files=list(d.glob("real_apk176_rev187_worksite_same_position_*.png"))
          assert len(files)==2,"MISSING_REAL_WORKSITE_2_VULKAN_PNG"
          for file in files:
              data=file.read_bytes()
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a') and len(data)>30000
              w,h=struct.unpack(">II",data[16:24])
              assert w>=900 and h>=500,(w,h)
              print("PASS_REAL_SAME_SITE_GODOT_SCREENSHOT",file.name,w,h,len(data))
          PY
      - name: Generate unsigned rev187 candidate bound to original APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 logic-qa/release-gate/sign_pck_release.py             --pack qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck             --revision 187 --minimum-android-code 1176 --maximum-android-code 1176             --pack-url 'https://160701541-cell.github.io/xinyanshuo/android-preview/canglan-content-rev-187.pck'             --notes '苍岚原APK176 rev187：取消五色限制，蓝色渐变天空与白云暖太阳淡蓝雾；真实远景地面、细草叶野花随开挖同步；镜头防穿模，右滑方向修正，上帝视角/自由飞行；帧率跟随屏幕最高120或手动30/60/90/120，可折叠单性能面板、建筑工标签；手机效果待实测。'             --unsigned-template             --output qa-results/rev187-unsigned.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('qa-results/rev187-unsigned.json')
          d=json.loads(p.read_text())
          assert d['revision']==187
          d['_visual_goal']='ORIGINAL_3D_WORLD_PREVIEW'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Detect pre-existing official rev187 release and protect signed PCK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('android-preview/latest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          current=int(d['revision'])
          if current == 186:
              assert not pathlib.Path('android-preview/canglan-content-rev-187.pck').exists(), 'rev187 file exists without manifest'
              print('PASS_REV187_NOT_YET_RELEASED_SIGNING_ALLOWED')
              with open(__import__('os').environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
                  f.write('REV187_ALREADY_PUBLISHED=false\n')
          elif current >= 187:
              assert pathlib.Path('android-preview/canglan-content-rev-187.pck').is_file(), 'rev187 manifest but PCK missing'
              print('PASS_REV187_ALREADY_PUBLISHED_QA_ONLY_NEVER_REPLACE_SIGNED_RELEASE',current)
              with open(__import__('os').environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
                  f.write('REV187_ALREADY_PUBLISHED=true\n')
          else:
              sys.exit('BLOCKED: unexpected OTA version; never publish out of order')
          PY
      - name: Sign only actual same-APK176 Godot accepted rev187 candidate
        if: env.REV187_ALREADY_PUBLISHED == 'false'
        shell: bash
        env:
          CANGLAN_PCK_SIGNING_KEY_B64: ${{ secrets.CANGLAN_PCK_SIGNING_KEY_B64 }}
          CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_ORIGINAL_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_PRIVATE_KEY_PEM }}
          CANGLAN_OTA_PRIVATE_KEY_PEM: ${{ secrets.CANGLAN_OTA_PRIVATE_KEY_PEM }}
          CANGLAN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CANGLAN_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
