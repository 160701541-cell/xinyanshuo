name: Canglan Open-Source Native 3D World - Strict Godot QA
on:
  push:
    branches: [main]
    paths:
      - 'game-source/godot3d/**'
      - 'tools/audit_public_3d.py'
      - '.github/workflows/canglan-public-qa.yml'
permissions:
  contents: read
concurrency:
  group: canglan-public-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  godot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage previously made lawful NPC sprites only - DO NOT GENERATE 3D MODELS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-source/godot3d/assets/generated
          python3 game-source/godot3d/tools/stage_existing_worldx_npcs.py \
            --out game-source/godot3d/assets/generated
          test -s game-source/godot3d/assets/generated/npc/worldx/plain_civilian.png
          # Kenney/Quaternius CC0 models are ALREADY committed to the public
          # source. Never re-run the retired procedural mannequin/house factory.
          test -s game-source/godot3d/assets/free_cc0/kenney/3d/castle/tree-log.glb
          test -s game-source/godot3d/assets/free_cc0/quaternius/glTF/Wall_Plaster_Straight.gltf
      - name: Ensure reviewed public game source exists
        run: |
          set -euo pipefail
          test -f game-source/godot3d/project.godot || { echo 'BLOCKED: reviewed public source not yet mirrored; website is not full game source'; exit 2; }
          test -f game-source/godot3d/tools/quality_gate.sh || { echo 'BLOCKED: full QA script absent'; exit 2; }
      - name: Install Godot 4.4.1 (free standard Linux runner)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Full strict QA (no bypass)
        shell: bash
        run: |
          set -euo pipefail
          cd game-source
          GODOT_BIN=/tmp/Godot_v4.4.1-stable_linux.x86_64 QA_LOG_DIR="$GITHUB_WORKSPACE/qa-logs" bash godot3d/tools/quality_gate.sh
      - name: Capture actual 3D gameplay framebuffer on Mesa software GPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          mkdir -p qa-logs
          CANGLAN_3D_SCREENSHOT="$GITHUB_WORKSPACE/qa-logs/real-godot-3d-world.png" \
          timeout 160s xvfb-run -a -s '-screen 0 1280x720x24' \
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility \
          --path game-source/godot3d \
          --script res://tests/capture_real_frame.gd \
          > qa-logs/visual-engine-capture.log 2>&1 || {
            cat qa-logs/visual-engine-capture.log
            exit 1
          }
          grep -Fq 'PASS REAL GODOT 3D FRAME CAPTURE' qa-logs/visual-engine-capture.log
          test -s qa-logs/real-godot-3d-world.png
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' qa-logs/visual-engine-capture.log; then
            echo 'BLOCKED: scene screenshot logged an engine error'
            exit 1
          fi
      - name: Upload real licensed-model Godot QA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canglan-strict-qa-${{ github.sha }}
          path: |
            qa-logs/
          compression-level: 2
          if-no-files-found: warn
          retention-days: 7
# The public source QA is not a release job. Signing keys MUST NEVER be committed.
# Auto publish requires a separately audited signed PCK packager and client verification.
