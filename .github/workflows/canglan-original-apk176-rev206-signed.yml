# Only runs on main with exact APK176 original Main/Godot + verified RSA.
name: Canglan ORIGINAL APK176 rev206 - Signed Real Herbs Spirit Ore and Tree Batch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canglan-original-apk176-rev206-signed.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: canglan-original-game-ota-rev206
  cancel-in-progress: false
jobs:
  rev206-original-apk176-signed-publish:
    if: github.repository == '160701541-cell/xinyanshuo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Source invariants for rev204 authentic combat without claiming gameplay QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_rev205_gameplay_source.py
      - name: Restore actual original APK176 exported resources without replacing fixtures with mocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-results qa-stage/ota177/{scenes,scripts,hd2d/courtyard,hd2d/worldx}
          cp game-source/apk176-ota177-candidate/scenes/* qa-stage/ota177/scenes/
          cp game-source/apk176-ota177-candidate/scripts/* qa-stage/ota177/scripts/
          test -s game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png
          cp game-source/apk176-ota177-candidate/hd2d/worldx-generated/source_edge04/main_house_edge04_candidate.png qa-stage/ota177/hd2d/courtyard/main_house_isolated_edge04.png
          cp game-source/apk176-ota177-candidate/hd2d/courtyard/*.png qa-stage/ota177/hd2d/courtyard/
          cp -R game-source/apk176-ota177-candidate/hd2d/worldx/. qa-stage/ota177/hd2d/worldx/
          cp art-source/hd2d/batch-20261016/01_village_props_atlas_preview.jpg qa-stage/ota177/hd2d/atlas_village_ota177.jpg
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          src=Path(json.loads(Path('android-preview/base-latest.json').read_text())['file'])
          root=Path('logic-qa/apk176-export-fixture')
          count=0
          total=0
          with ZipFile(src) as apk:
              for entry in apk.infolist():
                  if not entry.filename.startswith('assets/') or entry.is_dir():
                      continue
                  rel=Path(entry.filename[len('assets/'):])
                  if str(rel)=='project.godot':
                      continue  # Keep the deliberately minimal exported-runtime QA project config.
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit('APK zip path traversal blocked')
                  if entry.file_size > 100_000_000:
                      raise SystemExit('Unexpected single APK asset > 100MB: '+str(rel))
                  dst=root/rel
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(apk.read(entry))
                  count+=1
                  total+=entry.file_size
          assert (root/'.godot/global_script_class_cache.cfg').is_file()
          assert (root/'shaders/atmosphere/layered_cloud_sky.gdshader').is_file()
          print('PASS_REAL_APK176_FULL_EXPORTED_ASSET_FIXTURE',count,'files',total,'bytes')
          descriptor=root/'addons/terrain_3d/terrain.gdextension'
          if descriptor.is_file():
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_START')
              print(descriptor.read_text(encoding='utf-8',errors='replace')[:11000])
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_END')
          else:
              print('APK176_TERRAIN3D_GDEXTENSION_DESCRIPTOR_MISSING')
          with ZipFile(src) as apk:
              for n in apk.namelist():
                  if 'terrain' in n.lower() and (n.endswith('.so') or n.endswith('.gdextension') or n.endswith('.dll') or n.endswith('.dylib')):
                      print('APK176_NATIVE_TERRAIN_ENTRY',n)
          print('PASS_APK_NATIVE_TERRAIN_DIAGNOSTIC')
          PY
      - name: Recover exact-matching Terrain3D Linux QA plugin from trusted upstream releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          src=pathlib.Path(json.loads(pathlib.Path('android-preview/base-latest.json').read_text())['file'])
          with zipfile.ZipFile(src) as apk:
              name='lib/arm64-v8a/libterrain.android.debug.arm64.so'
              assert name in apk.namelist(), 'Actual APK176 Terrain3D Android native binary missing'
              raw=apk.read(name)
          pathlib.Path('/tmp/canglan-actual-android-terrain.so').write_bytes(raw)
          print('APK176_REAL_ANDROID_TERRAIN_SHA256',hashlib.sha256(raw).hexdigest(),'size',len(raw))
          PY
          for version in v1.0.1-stable v1.0.2-stable; do
            case "$version" in
              v1.0.1-stable) archive=Terrain3D_v1.0.1.zip ;;
              v1.0.2-stable) archive=Terrain3D_v1.0.2-stable.zip ;;
            esac
            if ! curl -fL --retry 2 --connect-timeout 15 --max-time 110 \
              "https://github.com/TokisanGames/Terrain3D/releases/download/$version/$archive" -o /tmp/upstream-terrain.zip; then
              echo "UPSTREAM_TERRAIN_DOWNLOAD_UNAVAILABLE $version"
              continue
            fi
            if CANGLAN_TERRAIN_VERSION="$version" python3 - <<'PY'
          import hashlib,os,zipfile,pathlib,sys
          expected=hashlib.sha256(pathlib.Path('/tmp/canglan-actual-android-terrain.so').read_bytes()).hexdigest()
          z=zipfile.ZipFile('/tmp/upstream-terrain.zip')
          names=z.namelist()
          android=[n for n in names if n.endswith('libterrain.android.debug.arm64.so')]
          linux=[n for n in names if n.endswith('libterrain.linux.debug.x86_64.so')]
          if not android or not linux:
              print('TERRAIN_RELEASE_MISSING_PLATFORM_BINARY',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          actual=hashlib.sha256(z.read(android[0])).hexdigest()
          print('UPSTREAM_TERRAIN_ANDROID_SHA256',os.environ['CANGLAN_TERRAIN_VERSION'],actual)
          if actual!=expected:
              print('NO_PROVEN_SAME_PLUGIN_VERSION',os.environ['CANGLAN_TERRAIN_VERSION'])
              sys.exit(2)
          target=pathlib.Path('logic-qa/apk176-export-fixture/addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so')
          target.parent.mkdir(parents=True,exist_ok=True)
          data=z.read(linux[0])
          target.write_bytes(data)
          print('PASS_EXACT_APK176_NATIVE_TERRAIN_VERSION_MATCHED_AND_LINUX_QA_LIBRARY_STAGED',
                os.environ['CANGLAN_TERRAIN_VERSION'],'LinuxBytes',len(data))
          PY
            then
              echo "MATCHED_NATIVE_TERRAIN_VERSION=$version" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${MATCHED_NATIVE_TERRAIN_VERSION:-}" ] && ! grep -q '^MATCHED_NATIVE_TERRAIN_VERSION=' "$GITHUB_ENV"; then
            echo 'BLOCKED: neither upstream release Android binary exactly matches APK176; no substitute DLL was injected'
          fi
      - name: Stage real Quaternius CC0 long hair and flying sword from immutable public-source Git blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_rev199_cc0_assets.py qa-stage/ota177/canglan_rev187
          test -s qa-stage/ota177/canglan_rev187/quaternius_hair_long_static.glb
          test -s qa-stage/ota177/canglan_rev187/quaternius_knight_sword.glb
          grep -Fq 'quaternius.com' qa-stage/ota177/canglan_rev187/rev199_cc0_asset_provenance.json
      - name: Install actual Godot 4.4.1 engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Build original APK176 living world with real material economy and seven licensed GLBs
        env:
          CANGLAN_OTA_STAGE_DIR: ${{ github.workspace }}/qa-stage/ota177
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-stage/ota177/canglan_rev187 qa-results
          cp game-source/godot3d/scripts/worldbox_life_sim.gd qa-stage/ota177/canglan_rev187/worldbox_life_sim.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_ecology_succession_rev187.gd qa-stage/ota177/canglan_rev187/ecology_growth.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_visual_palette_rev187.gd qa-stage/ota177/canglan_rev187/visual_palette.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_kenney_multimesh_rev187.gd qa-stage/ota177/canglan_rev187/kenney_multimesh.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_strata_terrain_rev187.gd qa-stage/ota177/canglan_rev187/strata_terrain.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_vivid_material_rev207.gd qa-stage/ota177/canglan_rev187/vivid_material.gd
          mkdir -p qa-stage/ota177/canglan_rev187/materials_rev207
          cp game-source/apk176-ota177-candidate/materials/rev207/*.png qa-stage/ota177/canglan_rev187/materials_rev207/
          cp game-source/apk176-ota177-candidate/materials/rev207/manifest.json qa-stage/ota177/canglan_rev187/materials_rev207/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('qa-stage/ota177/canglan_rev187/materials_rev207/manifest.json').read_text())
          assert m['schema']==207 and m['count']==9 and m['size']==512
          for item in m['maps']:
            raw=(Path('qa-stage/ota177/canglan_rev187/materials_rev207')/item['file']).read_bytes()
            assert hashlib.sha256(raw).hexdigest()==item['output_sha256']
          print('PASS_REV207_REAL_QUATERNIUS_NINE_FINE_PBR_MAPS_SOURCE_SHA256_IN_ORIGINAL_APK_STAGE')
          PY
          cp game-source/apk176-ota177-candidate/scripts/apk176_player_controller_rev187.gd qa-stage/ota177/canglan_rev187/player_controller.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_backpack_rev205.gd qa-stage/ota177/canglan_rev187/backpack.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_spirit_resources_rev206.gd qa-stage/ota177/canglan_rev187/spirit_resources.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_paid_housing_rev208.gd qa-stage/ota177/canglan_rev187/paid_housing.gd
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          proof=json.loads(Path("game-source/apk176-ota177-candidate/assets/cc0-spirit-rev206/asset_intake_proof.json").read_text())
          assert proof['asset_total']==7 and proof['committed_under_license']=='CC0-1.0'
          for a in proof['models']:
            payload=Path(a['path']).read_bytes()
            assert payload[:4]==b'glTF' and hashlib.sha256(payload).hexdigest()==a['sha256']
            dest=Path('qa-stage/ota177/canglan_rev187/cc0_spirit')/a['role']/(a['name']+'.glb')
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(payload)
          print('PASS_REV206_REAL_SOURCE_HASHED_7_QUATERNIUS_HERB_AND_ORE_BODIES_IN_ORIGINAL_GODOT_STAGE')
          PY
          mkdir -p qa-stage/ota177/canglan_rev187/ui/lucide
          cp game-source/apk176-ota177-candidate/ui/lucide/*.svg qa-stage/ota177/canglan_rev187/ui/lucide/
          cp game-source/apk176-ota177-candidate/ui/lucide/LICENSE qa-stage/ota177/canglan_rev187/ui/lucide/LICENSE
          cp game-source/apk176-ota177-candidate/scripts/apk176_cultivation_world_rev201.gd qa-stage/ota177/canglan_rev187/cultivation_world.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_root_taxonomy_rev206.gd qa-stage/ota177/canglan_rev187/root_taxonomy.gd
          cp game-source/apk176-ota177-candidate/scripts/apk176_city_population_rev206.gd qa-stage/ota177/canglan_rev187/city_population.gd
          # The import workflow already committed the EXACT original
          # fourteen CC0 GLBs plus SHA256 source proof. Stage all of them
          # instead of building blank procedural substitutes.
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          proof=json.loads(Path('game-source/apk176-ota177-candidate/assets/cc0-rev206/asset_intake_proof.json').read_text())
          assert proof['asset_total']==14
          for m in proof['models']:
              source=Path(m['path'])
              content=source.read_bytes()
              assert hashlib.sha256(content).hexdigest()==m['sha256'] and content[:4]==b'glTF'
              dest=Path('qa-stage/ota177/canglan_rev187/cc0_rev206')/m['role']/(m['name']+'.glb')
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(content)
          print('PASS_REV206_VERIFIED_14_ORIGINAL_LICENSED_GLBS_STAGED_IN_ACTUAL_ANDROID_PCK',sum(int(m['bytes']) for m in proof['models']))
          PY
          cp game-source/apk176-ota177-candidate/scripts/apk176_quality_profiles_rev187.gd qa-stage/ota177/canglan_rev187/quality_profiles.gd
          cp game-source/godot3d/assets/free_cc0/kenney/3d/nature/tree_oak.glb qa-stage/ota177/canglan_rev187/tree_oak.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/rocks-small.glb qa-stage/ota177/canglan_rev187/rocks_small.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/tree-log.glb qa-stage/ota177/canglan_rev187/tree_log.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/wall-narrow-wood-fence.glb qa-stage/ota177/canglan_rev187/wood_fence.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/stairs-stone.glb qa-stage/ota177/canglan_rev187/stone_steps.glb
          cp game-source/godot3d/assets/free_cc0/kenney/3d/castle/door.glb qa-stage/ota177/canglan_rev187/wood_door.glb
          cp game-source/godot3d/assets/free_cc0/quaternius_knight/public/models/knight.glb qa-stage/ota177/canglan_rev187/animated_knight.glb
          # The original Kenney Castle Kit rock GLB contains an EXTERNAL
          # res://Textures/colormap.png reference. Preserve its exact CC0 kit
          # palette; a GLB alone is not a complete colored asset.
          mkdir -p qa-stage/ota177/Textures qa-stage/ota177/canglan_rev187/Textures
          curl -fL --retry 3 --connect-timeout 20 --max-time 70 \
            'https://raw.githubusercontent.com/shorepine/kenney/main/3d/castle/Textures/colormap.png' \
            -o qa-stage/ota177/canglan_rev187/Textures/colormap.png
          cp qa-stage/ota177/canglan_rev187/Textures/colormap.png \
            qa-stage/ota177/Textures/colormap.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('qa-stage/ota177/canglan_rev187/Textures/colormap.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'The real Kenney source PNG is missing'
          assert len(b)>128 and 0<struct.unpack_from('>I',b,16)[0]<=4096
          print('PASS_LICENSED_KENNEY_CASTLE_COLORMAP_PRESENT',len(b))
          PY
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path logic-qa --import > qa-results/rev187-import.log 2>&1 || {
            tail -110 qa-results/rev187-import.log; exit 1;
          }
          timeout 75s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path logic-qa             --script res://tools/build_apk176_quality_rev187.gd > qa-results/rev187-build.log 2>&1 || {
            tail -110 qa-results/rev187-build.log; exit 1;
          }
          grep -Fq 'PASS_APK176_REV187_LIVING_3D_AUTONOMOUS_PCK_BUILT_UNSIGNED' qa-results/rev187-build.log || {
            tail -110 qa-results/rev187-build.log; exit 1;
          }
          python3 tools/verify_apk176_rev187_3d_pck.py qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
      - name: Parse-check ALL rev187 GDScript in a physical Godot project before testing APK PCK
        shell: bash
        run: |
          set -euo pipefail
          printf 'config_version=5\n' > qa-stage/ota177/project.godot
          for script in strata_terrain vivid_material quality_profiles player_controller backpack spirit_resources paid_housing cultivation_world root_taxonomy city_population visual_palette kenney_multimesh ecology_growth; do
            echo "GODOT_GDSCRIPT_COMPILE_CHECK $script"
            if ! timeout 35s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
                --path qa-stage/ota177 --check-only --script "res://canglan_rev187/$script.gd" \
                > "qa-results/rev187-parse-$script.log" 2>&1; then
              cat "qa-results/rev187-parse-$script.log"
              exit 1
            fi
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|Parser Error:|ERROR:' "qa-results/rev187-parse-$script.log"; then
              cat "qa-results/rev187-parse-$script.log"
              exit 1
            fi
          done
          echo PASS_REV187_ALL_ACTUAL_GODOT_SCRIPTS_PARSE_COMPILATION
      - name: Godot 4.4.1 13 real finite herbal/stone nodes, 108h actual regrowth, saved medicine consumed
        shell: bash
        run: |
          set -euo pipefail
          cp logic-qa/apk176-export-fixture/verify_rev206_spirit_resources.gd qa-stage/ota177/verify_rev206_spirit_resources.gd
          timeout 110s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path qa-stage/ota177 --script res://verify_rev206_spirit_resources.gd \
            > qa-results/rev206-spirit-resource-ledger.log 2>&1 || {
              tail -130 qa-results/rev206-spirit-resource-ledger.log; exit 1;
            }
          grep -Fq 'PASS_REV206_REAL_WORLD_13_HERB_ORE_SOURCE_CC0_NODES_PERSISTED_CONSERVATION_AND_18_TO_96H_REGROWTH' qa-results/rev206-spirit-resource-ledger.log
          grep -Fq 'PASS_REV206_REAL_GODOT_BACKPACK_PILL_CRAFT_SPENDS_HARVESTED_HERBS_SPIRIT_STONES_SAVES_AND_CONSUMES' qa-results/rev206-spirit-resource-ledger.log
      - name: Real Godot engine deterministic 32 spiritual roots, 640 mortal identities and virtual city of 10k to 250k
        shell: bash
        run: |
          set -euo pipefail
          cp logic-qa/apk176-export-fixture/verify_rev206_roots_city.gd qa-stage/ota177/verify_rev206_roots_city.gd
          timeout 110s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless \
            --path qa-stage/ota177 --script res://verify_rev206_roots_city.gd \
            > qa-results/rev206-real-roots-city.log 2>&1 || {
              tail -120 qa-results/rev206-real-roots-city.log; exit 1;
            }
          grep -Fq 'PASS_REV206_GODOT_PLAYER_AND_640_NAMED_NPCS_GUARANTEED_STABLE_ROOT_WITH_RECRUITABLE_NO_ROOT_EXCEPTION' qa-results/rev206-real-roots-city.log
          grep -Fq 'PASS_REV206_GODOT_32_ROOT_ATTRIBUTES_MUTATIONS_QUALITY_FIRE_ICE_THUNDER_STATUS_AND_ELEMENTS_COUNTERS' qa-results/rev206-real-roots-city.log
          grep -Fq 'PASS_REV206_GODOT_10000_80000_250000_CITY_MORTAL_POPULATION_LAZY_COUNTS_370_DAYS_NO_SCENE_BLOAT' qa-results/rev206-real-roots-city.log
      - name: QA actual APK176 Main runs animated workers, finite resources and material-paid staged 3D construction
        env:
          CANGLAN_QA_PCK_PATH: ${{ github.workspace }}/qa-results/canglan-apk176-rev187-3d-UNSIGNED.pck
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless             --path logic-qa/apk176-export-fixture             --script res://verify_original_main_quality_rev187.gd             > qa-results/rev187-original-main-3d.log 2>&1 || {
              tail -100 qa-results/rev187-original-main-3d.log; exit 1;
            }
          grep -Fq 'PASS_REV206_ORIGINAL_PLAYER_TREE_STONE_PHYSICAL_TRANSPORT_WITH_LICENSED_FINISHED_CC0_HOUSES_NO_BROKEN_CONSTRUCTION' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV208_NO_FREE_HOUSES_200WOOD150STONE_FIVE_RESIDENTS_AND_FOUR_TRUE_LARGE_YAO_BEASTS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV206_REAL_QUATERNIUS_CC0_SOURCE_HOUSES_REAL_YAO_BEASTS_PERSISTENT_PAID_WORKER_BUILDING' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV206_ALL_52_TREES_20_STONES_REAL_DRAWABLE_BATCH_SLOTS_GROW_WITHOUT_LOSS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV207_MOBILE_UNBLEACHED_SATURATED_PBR_NORMAL_MAPS_WORLDSPACE_64PIX_PER_METRE' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV206_REAL_MAIN_HAS_PERSISTENT_LICENCED_MEDICINAL_PLANTS_ORE_AND_TOUCH_MINING' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV188_REAL_HEALTH_STAMINA_GAME_HUD_BAG_MENU_AND_OPT_IN_DEV_TOOLS' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV189_SYNTHETIC_GODOT_JOYPAD_BUTTON_MENU_LOOK_DEADZONE_HOTPLUG_AND_TOUCH_FALLBACK_NOT_ANDROID_HARDWARE' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV191_NO_FLOATING_SLICE_LOD_OVERLAP_OR_22M_CLIFF_ACTUAL_MESH_TRIANGLES' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV193_DETERMINISTIC_WALKABLE_PHYSICAL_CHUNKS_NO_92M_WALL_AND_PERSISTED_MINING' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV193_ORIGINAL_PLAYER_ACTUALLY_WALKED_ACROSS_46M_WORLD_BOUNDARY' qa-results/rev187-original-main-3d.log
          grep -Fq 'PASS_REV194_PHYSICAL_STREAMED_MEADOWS_DEEP_GREENS_AND_NO_WASHOUT_FOG' qa-results/rev187-original-main-3d.log
