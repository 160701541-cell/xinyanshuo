      - name: Preserve exact unedited original APK176 Main screenshots in Draft PR, NOT the phone release
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # A slow historical renderer MUST NOT overwrite or rebase
          # authentic screenshots from a newer source commit.
          remote_sha="$(git ls-remote origin refs/heads/feat/rev208-green-kenney-saplings-vegetation | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "REV208_STALE_OLD_RENDER_SCREENSHOTS_ONLY_AS_GITHUB_ARTIFACT_NOT_COMMITTED"
            exit 0
          fi
          snapshot_dir=art/actual-engine-capture/rev208-candidate
          source_dir=qa-results/rev187-real-worksite
          mkdir -p "$snapshot_dir"
          for file in real_godot_rev208_mature_oak_8m_vs_avatar.png \
                      real_godot_rev208_mature_maple_9m_vs_avatar.png \
                      real_godot_rev208_mature_linden_8m_vs_avatar.png \
                      real_godot_rev208_hq_pine_forest_actual_main.png \
                      real_godot_rev208_hq_cypress_grove_actual_main.png \
                      real_godot_rev208_hq_fern_understory_actual_main.png \
                      real_godot_rev208_32m_vendor_fern_grass_actual_3d_floor_main.png \
                      real_godot_rev208_p0_actual_mature_pine_no_toy_foreground_pbr_understory.png \
                      real_godot_rev208_npc_death_state.png \
                      real_apk176_rev206_spirit_herbs_original_quaternius.png \
                      real_apk176_rev207_vivid_cc0_texture_forest_wide.png; do
            test -s "$source_dir/$file" || exit 32
            cp "$source_dir/$file" "$snapshot_dir/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          d=Path("art/actual-engine-capture/rev208-candidate")
          for png in sorted(d.glob("*.png")):
            b=png.read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n' and len(b)>20000,png
            assert struct.unpack(">II",b[16:24])==(1280,720),png
            print("REV208_GODOT_ORIGINAL_MAIN_DRAFT_SCREENSHOT_NOT_PHONE",png,len(b))
          assert len(list(d.glob("*.png")))>=9
          PY
          git config user.name "canglan-rev208-original-main-visual-qa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot_dir"
          if git diff --cached --quiet; then
            echo "No changes to authentic PNG comparison; keep Draft PR unchanged"
            exit 0
          fi
          git commit -m "art(rev208 Draft): true unretouched Godot441 original APK176 forest and player comparisons"
          # Unchanged pinned CI source must remain the current branch head.
          # A competing source write makes push fail safely instead of rebasing
          # binary PNG evidence from an old source snapshot.
          remote_after="$(git ls-remote origin refs/heads/feat/rev208-green-kenney-saplings-vegetation | cut -f1)"
          if [ "$remote_after" != "$GITHUB_SHA" ]; then
            echo "REV208_SOURCE_CHANGED_AFTER_CAPTURE_NO_STALE_EVIDENCE_PUSH"
            exit 0
          fi
          git push origin HEAD:feat/rev208-green-kenney-saplings-vegetation
          echo PASS_REV208_ORIGINAL_MAIN_UNALTERED_GODOT_SCREENSHOTS_ONLY_IN_DRAFT_PR_NO_OTA
