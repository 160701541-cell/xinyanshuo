name: Canglan source-license Chinese xianxia prefab authenticity probe - no OTA
on:
  push:
    branches: [feat/rev206-true-housing-physical-combat-vitals]
    paths: ['.github/workflows/canglan-rev206-chinese-prefab-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real-cc0-assets:
    if: github.repository == '160701541-cell/xinyanshuo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CC0 original source manifest and download actual original Chinese hall GLB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          url='https://3dassets.dev/api/v1/packs/imperial-china-palace-and-garden'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'CanglanOfficialGame-SourceAudit/206'})
              raw=urllib.request.urlopen(req,timeout=30).read(2000000)
              data=json.loads(raw)
              print('SOURCE_MANIFEST_TOP_LEVEL',list(data)[:25] if isinstance(data,dict) else len(data))
              print('SOURCE_MANIFEST_SNIPPET',json.dumps(data,ensure_ascii=False)[:1500])
          except Exception as exc:
              print('SOURCE_API_UNAVAILABLE',str(exc)[:500])
          url='https://cdn.3dassets.dev/assets/36163/v1/model.glb'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'CanglanOriginal-CC0-Probe/206'})
              raw=urllib.request.urlopen(req,timeout=30).read(2000000)
              print('CHINESE_HALL_GLTF_MAGIC',raw[:4],len(raw))
              assert raw[:4]==b'glTF' and len(raw)>60000
              print('PASS_REV206_ACTUAL_CHINESE_CC0_GLTF_HALL_SOURCE_REACHABLE')
          except Exception as exc:
              print('SOURCE_CHINESE_PREFAB_BLOCKED',str(exc)[:500])
              raise
          PY
