name: Canglan source-license Chinese xianxia prefab authenticity probe - no OTA
on:
  push:
    branches: [feat/rev206-true-housing-physical-combat-vitals]
    paths: ['.github/workflows/canglan-rev206-chinese-prefab-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-real-cc0-assets:
    if: github.repository == '160701541-cell/xinyanshuo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original Quaternius Knight glTF names for REAL sit/cultivation pose animations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('game-source/godot3d/assets/free_cc0/quaternius_knight/public/models/knight.glb')
          raw=p.read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,4)[0]==2
          n,magic=struct.unpack_from('<II',raw,12)
          assert magic==0x4e4f534a
          obj=json.loads(raw[20:20+n])
          print('AUTHENTIC_KNIGHT_ANIMATIONS', [a.get('name','') for a in obj.get('animations',[])])
          print('AUTHENTIC_KNIGHT_MESH_NODES', [(n.get('name',''),n.get('mesh')) for n in obj.get('nodes',[]) if 'mesh' in n][:28])
          print('PASS_REV206_AUTHORITATIVE_ANIMATION_DATA_INSPECTED_NOT_FAKE_CROSS_LEG_CLIP')
          PY
