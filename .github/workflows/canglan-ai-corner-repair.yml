name: Canglan apply saved AI corner repairs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/canglan-ai-corner-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canglan-ai-corner-repair
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Reconstruct repaired originals and assert all outside pixels unchanged
        run: python3 tools/asset_factory/apply_ai_corner_repair.py --root game-source/apk176-ota177-candidate/hd2d/worldx-generated/batch02
      - name: Commit repaired siblings and reproducible QA evidence
        run: |
          git config user.name 'canglan-actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-source/apk176-ota177-candidate/hd2d/worldx-generated/batch02/*_repaired.png game-source/apk176-ota177-candidate/hd2d/worldx-generated/batch02/corner_repair_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'art: apply AI corner repairs while preserving all outside source pixels'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
