name: ZhiYin Native Android APK
on:
  push:
    branches:
      - 'zhiyin/native-android-prototype'
    paths:
      - 'zhiyin-native/**'
      - '.github/workflows/zhiyin-native-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zhiyin-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build native Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Print APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-native-android-v0.1
          path: zhiyin-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
