name: ZhiYin Native Android APK
on:
  push:
    branches:
      - 'zhiyin/native-android-prototype'
    paths:
      - 'zhiyin-native/**'
      - '.github/workflows/zhiyin-native-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zhiyin-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Create repeatable LAB test signing key
        run: |
          python3 -m pip install --quiet 'cryptography>=42,<47'
          python3 ci/make_lab_signer.py
          echo "ZHIYIN_SIGNING_FILE=$RUNNER_TEMP/zhiyin-test-signing.p12" >> "$GITHUB_ENV"
          echo "ZHIYIN_SIGNING_PASSWORD=PublicLabOnly2026" >> "$GITHUB_ENV"
      - name: Install native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned llama.cpp source
        run: |
          mkdir -p app/src/main/cpp/llama.cpp
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/1ba568c5ad5c6c718984bd2bf4e7c71485b706f9 \
            | tar -xz --strip-components=1 -C app/src/main/cpp/llama.cpp
          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt
      - name: Build native Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify test APK signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Print APK SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-native-android-v0.6
          path: zhiyin-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
