name: Canglan HD2D artgen batch01 (2.5D plates + props)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == '160701541-cell/xinyanshuo'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 3 scene plates + 3 props (sequential, no retry)
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/asset_factory/hd2d_plate_batch01.mjs
      - name: Report what was produced
        run: |
          ls -la game-source/apk176-ota177-candidate/hd2d/artgen-batch01 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hd2d-artgen-batch01
          path: game-source/apk176-ota177-candidate/hd2d/artgen-batch01/
          if-no-files-found: warn
