name: 'WorldBox External MOD Lab v0.9 - NOT Canglan game'
on:
  push:
    branches:
      - 'worldbox/external-mod-lab-v09'
    paths:
      - 'tools/worldbox-xianxia/**'
      - '.github/workflows/worldbox-external-mod-lab-v09.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 'Source regression tests - NOT Android certification'
        run: |
          python -m compileall -q tools/worldbox-xianxia
          python -m unittest discover -s tools/worldbox-xianxia -p 'test_v*.py' -v
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 'Compile observer syntax against non-shipping contract stubs'
        run: dotnet build tools/worldbox-xianxia/tests/WorldBoxObserver.SourceSyntax.csproj -c Release --verbosity quiet
      - name: 'WorldBox external MOD only: prevent main-game edits'
        run: python tools/worldbox-xianxia/scope_gate.py
      - name: 'Ensure only source code is published in third-party test folder'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths=subprocess.check_output(['git','ls-files','--','tools/worldbox-xianxia'],text=True).splitlines()
          forbidden={'.apk','.pck','.dll','.pdb','.rar','.7z','.aab'}
          wrong=[p for p in paths if Path(p).suffix.lower() in forbidden]
          assert not wrong,wrong
          print('PASS source-only: ',len(paths),'files')
          PY
  android-public-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: 'Fetch official Android NML DLL and public reference assemblies (transient)'
        run: |
          set -euo pipefail
          mkdir -p /tmp/wb-android-public-sdk
          curl -fLsS --retry 2 --connect-timeout 20 -o /tmp/wb-android-public-sdk/NeoModLoader_mobile.dll https://github.com/WorldBoxOpenMods/AndroidModLoader/releases/download/latest/NeoModLoader_mobile.dll
          echo "9ed209cdc783ed26998d31e461d1bbd317c83aff7ed8eefe844ddb0878a19c6a  /tmp/wb-android-public-sdk/NeoModLoader_mobile.dll" | sha256sum --check --status
          for fn in UnityEngine.CoreModule.dll UnityEngine.IMGUIModule.dll Assembly-CSharp.dll Assembly-CSharp-firstpass.dll Il2CppInterop.Runtime.dll Il2Cppmscorlib.dll; do
            curl -fLsS --retry 2 --connect-timeout 20 -o "/tmp/wb-android-public-sdk/$fn" "https://raw.githubusercontent.com/WorldBoxOpenMods/AndroidModLoader/master/android-assembly-dependencies/$fn"
            test -s "/tmp/wb-android-public-sdk/$fn"
          done
      - name: 'Compile against ACTUAL public Android NML, Unity and WorldBox APIs; never use source stubs'
        run: |
          dotnet build tools/worldbox-xianxia/tests/WorldBoxObserver.AndroidSdk.csproj -c Release --verbosity quiet -p:AndroidSdkPath=/tmp/wb-android-public-sdk
          echo 'SDK API compile candidate only; not an APK or an installed/loaded Android MOD'
      - name: 'Package original MOD source plus original compiled probe, no third-party DLL'
        run: |
          set -euo pipefail
          mkdir -p /tmp/worldbox-v09/XianxiaObserver/Code /tmp/worldbox-v09/Compiled_CANDIDATE_ONLY
          cp tools/worldbox-xianxia/nml-observer-v07/mod.json /tmp/worldbox-v09/XianxiaObserver/mod.json
          cp tools/worldbox-xianxia/nml-observer-v07/Code/XianxiaObserverV07.cs /tmp/worldbox-v09/XianxiaObserver/Code/
          cp tools/worldbox-xianxia/tests/bin/Release/net8.0/XianxiaObserverMobileSDKProbe.dll /tmp/worldbox-v09/Compiled_CANDIDATE_ONLY/
          printf '%s\n' 'WorldBox OTHER-GAME derivative MOD candidate only, unrelated to Canglan.' 'Android 0.51.4 loader and NML runtime remain UNVERIFIED. This ZIP is not an APK, not an installer, and is not approved for save data.' > /tmp/worldbox-v09/README_ANDROID_DEVICE_PENDING.txt
          sha256sum /tmp/worldbox-v09/Compiled_CANDIDATE_ONLY/*.dll > /tmp/worldbox-v09/COMPILED_PROBE_SHA256.txt
          test "$(find /tmp/worldbox-v09 -name '*.dll' | wc -l)" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: 'worldbox-xianxia-nml-v09-source-plus-compiled-CANDIDATE'
          path: /tmp/worldbox-v09/
          if-no-files-found: error
          retention-days: 14
