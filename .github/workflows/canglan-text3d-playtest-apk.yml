name: Canglan 3D text-NPC playable Android APK - fast game loop QA
on:
  push:
    branches: [main]
    paths:
      - 'game-source/godot3d/**'
      - '.github/workflows/canglan-text3d-playtest-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: canglan-text3d-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-text3d-apk:
    name: Full Godot gameplay QA then Android debug text NPC APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Android SDK using existing runner (no NDK required)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$bin"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$bin" --sdk_root="$sdk_root" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Get pinned Godot editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.4.1-stable"
          curl -fL --retry 3 --connect-timeout 20 "$base/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 --connect-timeout 20 "$base/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-editor /tmp/godot-templates
          unzip -q /tmp/godot.zip -d /tmp/godot-editor
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          chmod +x /tmp/godot-editor/Godot_v4.4.1-stable_linux.x86_64
      - name: Temporary debug signing key, preserve original APK identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" qa-logs
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 365 \
            -keystore "$RUNNER_TEMP/canglan-text3d-qa.keystore" -alias androiddebugkey \
            -storepass android -keypass android -dname 'CN=Canglan Text3D QA,O=Temporary CI,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/canglan-text3d-qa.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/canglan-text3d-qa.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Compile all 43 game-source models and verify bytes
        run: |
          set -euo pipefail
          python3 tools/audit_public_3d.py --root .
          pip install -r game-source/godot3d/tools/requirements-models.txt
          python3 game-source/godot3d/tools/generate_glb_pack.py --out game-source/godot3d/assets/generated > qa-logs/glb-generation.log
          python3 game-source/godot3d/tests/test_generated_glb.py --root game-source/godot3d/assets/generated > qa-logs/glb-audit.log
      - name: Real Godot scene import and NPC interaction acceptance
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-editor/Godot_v4.4.1-stable_linux.x86_64
          "$GODOT" --headless --editor --path game-source/godot3d --import > qa-logs/import.log 2>&1 || { cat qa-logs/import.log; exit 1; }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' qa-logs/import.log; then
            cat qa-logs/import.log; exit 1;
          fi
          timeout 150s "$GODOT" --headless --path game-source/godot3d --script res://tests/world_smoke.gd > qa-logs/world-smoke.log 2>&1 || { cat qa-logs/world-smoke.log; exit 1; }
          grep -Fq 'PASS PUBLIC CANGLAN 3D GODOT SCENE' qa-logs/world-smoke.log
          timeout 90s "$GODOT" --headless --path game-source/godot3d --script res://tests/worldbox_life_smoke.gd > qa-logs/life-smoke.log 2>&1 || { cat qa-logs/life-smoke.log; exit 1; }
          grep -Fq 'PASS CAC WORLD LIFE SIM' qa-logs/life-smoke.log
          timeout 90s "$GODOT" --headless --path game-source/godot3d --script res://tests/autonomous_job_smoke.gd > qa-logs/worker-smoke.log 2>&1 || { cat qa-logs/worker-smoke.log; exit 1; }
          grep -Fq 'PASS CAC AUTONOMOUS NPC LOOP' qa-logs/worker-smoke.log
          if grep -Eh 'SCRIPT ERROR:|Parse Error:|Assertion failed|ERROR:' qa-logs/*smoke.log; then
            echo 'BLOCKED native scene errors'
            exit 1
          fi
      - name: Export playable Godot Android 3D text NPC test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          GODOT=/tmp/godot-editor/Godot_v4.4.1-stable_linux.x86_64
          "$GODOT" --headless --path game-source/godot3d \
            --export-debug 'Android Canglan 3D QA' "$GITHUB_WORKSPACE/release/Canglan-3D-TextNPC-Playtest.apk" \
            > qa-logs/export.log 2>&1 || { cat qa-logs/export.log; exit 1; }
          test -s release/Canglan-3D-TextNPC-Playtest.apk
          unzip -t release/Canglan-3D-TextNPC-Playtest.apk | tail -n 2
          if unzip -Z1 release/Canglan-3D-TextNPC-Playtest.apk | grep -E 'libcanglan_ai|Qwen3-0.6B.Q4_K_M.gguf'; then
            echo 'BLOCKED: FAST test package must not claim uncompiled native AI'
            exit 1
          fi
          sha256sum release/Canglan-3D-TextNPC-Playtest.apk > release/apk.sha256
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canglan-3d-text-npc-playtest-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
      - name: Publish separately-installable pre-release APK for direct phone testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="canglan-text3d-playtest-${GITHUB_SHA:0:12}"
          gh release create "$TAG" release/Canglan-3D-TextNPC-Playtest.apk release/apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "苍岚 3D文字NPC玩法测试 · ${GITHUB_SHA:0:12}" \
            --notes "独立Android 3D技术试玩：80名真正不同身份的文字NPC、点选个体状态UI、村庄耕作运输建设；暂不包含本地AI权重/原生推理。不会覆盖原签名游戏，也不保证旧APK存档同步。切勿卸载原游戏。" --prerelease
      - name: Preserve diagnostics for failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canglan-text3d-qa-logs-${{ github.sha }}
          path: qa-logs/
          if-no-files-found: warn
          retention-days: 14
