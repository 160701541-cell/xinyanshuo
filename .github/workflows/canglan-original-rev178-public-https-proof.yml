name: Canglan ORIGINAL APK176 rev178 - LIVE Public HTTPS OTA Pack Integrity
on:
  push:
    branches: [main]
    paths:
      - 'tools/verify_original_rev178_public_ota_http.py'
      - '.github/workflows/canglan-original-rev178-public-https-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-ota-http:
    if: github.repository == '160701541-cell/xinyanshuo'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original installed APK176 update from live GitHub Pages HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_original_rev178_public_ota_http.py
          python3 tools/verify_original_rev178_public_ota_http.py
      - name: Keep public update proof with NO PRIVATE KEYS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Canglan-Original-APK176-Rev178-Public-HTTPS-Integrity
          path: qa-results/original-rev178-public-http-acceptance.json
          if-no-files-found: warn
          retention-days: 14
